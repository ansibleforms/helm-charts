# ==============================================================================
# NAMING
# ==============================================================================
# Every resource is named after the release: <release>-server, <release>-mysql,
# <release>-secrets and so on. They used to be plain literals ("server",
# "mysql"), which meant two releases in one namespace overwrote each other's
# Deployments and each Service selected the other one's pods.
#
# nameOverride changes the app.kubernetes.io/name label, fullnameOverride
# replaces the release name as the prefix of every resource name. Both are
# optional and almost nobody needs them.
# -- Overrides the app.kubernetes.io/name label.
nameOverride: ''
# -- Replaces the release name as the prefix of every resource name.
fullnameOverride: ''

# ==============================================================================
# LABELS AND ANNOTATIONS FOR EVERYTHING
# ==============================================================================
# Added to every object the chart creates, and to both pods. Useful for cost
# tags, ownership, Argo CD tracking, backup selectors and the like.
#
# commonLabels never reach a Deployment's selector. A selector is immutable
# once the Deployment exists, so a label added there could never be changed or
# removed again, and an existing release would fail to upgrade outright.
# -- Labels added to every object and both pods (never to a selector).
commonLabels: {}
#   team: platform
#   cost-center: "4711"

# -- Annotations added to every object and both pods.
commonAnnotations: {}
#   example.com/owner: platform@example.com

# ==============================================================================
# PULLING THE IMAGES
# ==============================================================================
# Secrets used to pull both images, for a private registry or a mirror. The
# Secrets have to exist in the release namespace already, the chart does not
# create them:
#
#   kubectl -n <namespace> create secret docker-registry regcred \
#     --docker-server=registry.example.com \
#     --docker-username=... --docker-password=...
#
# Override per component with containers.server.imagePullSecrets or
# containers.mysql.imagePullSecrets when the two images live in different
# registries.
# -- Pull secrets for both images; they must already exist in the namespace.
imagePullSecrets: []
#   - name: regcred

# ==============================================================================
# RUNNER MODE
# ==============================================================================
# The chart installs AnsibleForms by default: the app, its MySQL and an RTE next to it in
# the server pod. With runner.enabled it installs only an RTE instead, a Runner that dials
# an AnsibleForms app installed elsewhere (another namespace, another cluster, a VM) and
# keeps one WebSocket open to it (RTE_MODE=outbound). The app sends it each job over that
# socket, with the job's files, and stores what comes back, so the runner needs no
# database, no encryption key and no inbound port: only its way out to the app's address.
#
# What it renders: one Deployment, <release>-rte, a PVC for its spool and job files
# (<release>-rte-pvc, sized and classed by storages.server), the <release>-keys Secret
# holding its RTE_TOKEN (generated once and kept, as for the RTE in the server pod, or
# containers.rte.existingTokenSecret) and the join token, a NetworkPolicy with
# networkPolicy.enabled, and a helm test that the app answers from the namespace. No app,
# no MySQL, no Service, no Ingress, no config seed. Every other value of the app is ignored.
#
# The container is configured as the RTE in the server pod is: containers.rte (image,
# resources, probes, extraEnv, extraEnvFrom, extraVolumeMounts) and applications.rte.env
# (HTTPS_PROXY, NO_PROXY, NODE_EXTRA_CA_CERTS, RTE_MAX_JOBS and so on). The pod takes its
# scheduling, pull secrets, service account and security context from containers.server.
#
# Approval: the first time it joins, an app that does not know it holds it as waiting
# until an admin approves it under Connections > Runners. A join token made there
# (runner.joinToken) approves it at once, for an unattended install. From then on it signs
# in with its own RTE_TOKEN, which the app keeps: keep the <release>-keys Secret with it.
#
#   helm install runner1 ansibleforms/ansibleforms --namespace runners --create-namespace \
#     --set runner.enabled=true \
#     --set runner.appUrl=https://forms.example.com \
#     --set runner.joinToken=afj_...
runner:
  # -- true installs only an RTE (a Runner) that dials an AnsibleForms app elsewhere: no app, no database, no ingress.
  enabled: false
  # The address with its BASE_URL if the app has one. The RTE adds the socket's path to it
  # and dials it over wss:// (ws:// for an http address).
  # -- The app's address as people open it (https://forms.example.com). Required with runner.enabled.
  appUrl: ""
  # The app knows the runner by this name, and forms name it with runner: <name>, so it
  # has to stay the same across restarts. Letters, digits and . _ - : @ only.
  # -- The runner name it joins as (RTE_NAME). Empty: the release name.
  name: ""
  # Read on the first start only: once approved, the runner signs in with its own token and
  # the join token may expire or be revoked. It goes into the <release>-keys Secret, so it
  # passes through the release history Helm keeps; make it single-use (maxUses 1).
  # -- A join token made in the app (Connections > Runners), used on the first start to be approved at once. Empty: it waits for an admin's approval.
  joinToken: ""
  # With true, a private CA is named through NODE_EXTRA_CA_CERTS in applications.rte.env.
  # -- false accepts the app's self-signed certificate (APP_TLS_VERIFY=0), inside one trusted network only.
  appTlsVerify: true

# ==============================================================================
# MYSQL DEPLOYMENT
# ==============================================================================
# Whether the chart deploys its own MySQL. Turn it off to point AnsibleForms at
# a database you already run, and set applications.mysql.host and .port below to
# reach it. The Deployment, Service, PVC and the two ConfigMaps are then all
# skipped, so nothing has to be cleaned up afterwards.
#
# Careful with an existing release: disabling this deletes the MySQL PVC and,
# with a reclaim policy of Delete, the data along with it. Take a dump first.
mysql:
  # -- Deploy the bundled MySQL. Off to use an existing database (deletes the MySQL PVC on an existing release).
  enabled: true

  # The my.cnf of the bundled database. Mounted over /etc/mysql/my.cnf, which
  # replaces the file the image ships instead of adding to it. On the official
  # image that file is little more than an !includedir pointing at
  # /etc/mysql/conf.d, so what you give up is the ability to drop extra files
  # in there, not any tuning of its own.
  #
  # The default is the bare header the chart has always mounted. Anything under
  # [mysqld] goes here:
  #
  #   config: |
  #     [mysqld]
  #     max_allowed_packet = 64M
  #     character-set-server = utf8mb4
  #     collation-server = utf8mb4_unicode_ci
  #
  # Changing this does not restart the pod on its own. A ConfigMap update is
  # picked up on the next restart, so roll it yourself, or put a checksum in
  # containers.mysql.podAnnotations so Helm does it for you.
  # -- my.cnf for the bundled MySQL, mounted over /etc/mysql/my.cnf.
  config: |
    [mysqld]

applications:

  # MYSQL CONFIGURATION
  # user and password are the credentials AnsibleForms connects with, whether
  # the database is the bundled one or your own. Leave password out entirely if
  # you supply the credentials through secrets.existingSecret further down.
  mysql:
    # -- Database password. Leave out with secrets.existingSecret or secrets.generate.
    password: <ENTER_PASSWORD_HERE>
    # Left empty, the chart reads the user back from the release's Secret, so an upgrade
    # keeps the one it connects as (root, for a release from chart 6.x). A new install
    # with the bundled MySQL gets "ansibleforms", which MySQL creates with rights on the
    # AnsibleForms schema only, and a database of your own gets root.
    #
    # Reading the Secret back needs a cluster. Under helm template, and so Argo CD and
    # Flux, the chart cannot, and with the bundled MySQL it refuses an empty user rather
    # than guess: set root to keep a 6.x release as it is, ansibleforms on a new install.
    # -- Database user. Empty keeps the user the Secret holds, or "ansibleforms" on a new install with the bundled MySQL. Required under helm template, Argo CD or Flux.
    user: ""
    # Defaults to the bundled service on "mysql":3306. Point these at your own
    # server when mysql.enabled is false.
    # host: "mysql"
    # port: "3306"

  # SERVER CONFIGURATION
  server:
    # -- Environment variables for AnsibleForms. Any application setting can be added here.
    env:
      # -------- BASIC ENV VARIABLES REQUIRED --------
      # -- 1 serves HTTPS on 443 with the built-in self-signed certificate, 0 serves HTTP on 80.
      HTTPS: 0 # Enables/Disables HTTP/HTTPS Ports 0 [(false) -> port: 80] [1 (true) -> port: 443]
      # -- Password of the local admin user created on first start.
      ADMIN_PASSWORD: <ENTER_PASSWORD_HERE>
      # -- Name of the local admin user created on first start.
      ADMIN_USERNAME: admin
      # -- Key that encrypts stored credentials. Never change it once data exists.
      ENCRYPTION_SECRET: <ENTER_SECRET_HERE>
      # The settings pages can save environment variables to a .env file on the
      # persistent volume. Here the environment is declared in these values, so a
      # setting saved in the interface would quietly override this file on every
      # restart and drift away from it. AnsibleForms recommends 0 for Kubernetes:
      # the pages then show every variable read-only, with the value in force.
      # -- 0 makes the settings pages read-only for environment variables, so these values stay the only source.
      ALLOW_ENV_EDIT: 0
      # ACCESS_TOKEN_SECRET signs the sessions. Left out, the chart generates one into the
      # <release>-keys Secret and keeps it across upgrades, so nobody is signed out when
      # the pod restarts. Set it here, or in containers.server.extraEnv from a Secret of
      # your own (the chart then generates none), to choose it. Under helm template, and
      # so Argo CD and Flux, the chart cannot read a generated one back and refuses to
      # generate it: set it there.
      # ACCESS_TOKEN_SECRET: <a long random string>

      # -------- EXTRA ENV VARIABLES FOR SERVER --------

      # ******** IGNORE PRIVATE CA CERTS ********
      # NODE_TLS_REJECT_UNAUTHORIZED: 0

      # ******** ENABLE THIS FOR PRIVATE CA CERTS ********
      # NODE_EXTRA_CA_CERTS: /etc/custom-certs/custom-ca.crt

  # RTE CONFIGURATION
  # AnsibleForms 7 runs no playbook itself: every playbook runs on an RTE (runtime
  # environment), the same server started with AF_ROLE=rte. The chart runs one next to the
  # app, in the server pod (see containers.rte).
  rte:
    # The token the app signs in to the RTE's socket with, at least 16 characters. Left
    # empty, the chart generates one on the first install and keeps it in the
    # <release>-keys Secret, so it never moves afterwards. It is not a key to any data: the
    # chart's config seed hands the same value to the runner's RTE credential on every start.
    #
    # Under helm template, and so Argo CD and Flux, the chart cannot read a generated one
    # back. A new one on every sync would reach one container and not the other after a
    # restart, and every job would be refused with a 401, so the chart refuses to generate
    # it there: set it, or use containers.rte.existingTokenSecret.
    # -- RTE token, 16 characters or more. Empty generates one, which needs a cluster to read (not under helm template, Argo CD or Flux). Ignored with containers.rte.existingTokenSecret.
    token: ''
    # Settings that belong to the RTE now rather than to the app, such as ANSIBLE_PATH and
    # PROCESS_MAX_BUFFER. Move them here from applications.server.env.
    # -- Environment variables for the RTE (ANSIBLE_PATH, PROCESS_MAX_BUFFER, NODE_EXTRA_CA_CERTS and so on).
    env: {}

# ==============================================================================
# CONTAINERS CONFIGURATION
# ==============================================================================
containers:

# ~~~~

  mysql:
    # ===================================================
    # WHERE THIS POD IS ALLOWED TO RUN
    # ===================================================
    # Plain Kubernetes, passed through as written. All optional and all empty
    # by default, so nothing changes unless you set them. The database is the
    # half that owns a volume, so this is usually the one that needs pinning
    # to whatever node its storage lives on.
    # -- MySQL pod nodeSelector.
    nodeSelector: {}
    #   kubernetes.io/hostname: node-1
    # -- MySQL pod tolerations.
    tolerations: []
    #   - key: node-role.kubernetes.io/control-plane
    #     operator: Exists
    #     effect: NoSchedule
    # -- MySQL pod affinity.
    affinity: {}
    # -- MySQL pod topology spread constraints.
    topologySpreadConstraints: []
    # -- MySQL pod priority class.
    priorityClassName: ''
    # Extra labels and annotations on the pod only, on top of commonLabels.
    # -- Extra labels on the MySQL pod.
    podLabels: {}
    # -- Extra annotations on the MySQL pod.
    podAnnotations: {}
    # Overrides the release wide imagePullSecrets for this image alone.
    # -- Pull secrets for the MySQL image only; overrides imagePullSecrets.
    imagePullSecrets: []
    # The chart does not create a ServiceAccount. Name one you manage yourself.
    # -- Existing ServiceAccount for the MySQL pod. Empty uses the namespace default.
    serviceAccountName: ''

    # Pinned on purpose. A floating tag means an unattended major upgrade the
    # next time the pod is rescheduled, and MySQL does not support downgrades,
    # so a rollback would leave the data directory unreadable.
    # Already running a 9.x image? Set this to your current tag before upgrading.
    # -- MySQL image.
    image: mysql:8.4
    # -- MySQL image pull policy.
    imagePullPolicy: IfNotPresent
    # -- MySQL container resources.
    resources:
      limits:
        cpu: '2'
        memory: 2048Mi
      requests:
        cpu: '0.5'
        memory: 512Mi

    # ===================================================
    # HEALTH CHECKS
    # ===================================================
    # All three run the same command. mysqladmin ping exits 0 as soon as the
    # server answers, and it answers "access denied" long before it would answer
    # a query, which is the signal wanted here: the port is open and the server
    # is talking. No credentials are needed for that, so the root password never
    # reaches a command line where every ps in the container would show it.
    #
    # A plain TCP check would not do. While the data directory is being created
    # the entrypoint runs a temporary server on a socket with networking off, so
    # a port check calls MySQL ready long before it is.
    # -- Command behind all three MySQL probes. Empty uses mysqladmin ping over TCP.
    probeCommand: []
    #   - sh
    #   - -c
    #   - mysqladmin ping -h 127.0.0.1 --protocol=TCP --silent

    # Holds the other two back while the data directory is created and the init
    # script runs, which on a first boot takes far longer than a healthy server
    # ever will. failureThreshold x periodSeconds is the budget, 300s here.
    # -- MySQL startup probe; failureThreshold x periodSeconds is the first-boot budget.
    startup:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

    # Without this the Service advertised a ready endpoint the moment the
    # container started, while MySQL was still refusing connections. Measured on
    # an empty data directory that window is about ten seconds, and it grows
    # with the size of the volume and the init script.
    #
    # It does not make AnsibleForms start any faster. The server retries either
    # way, and it actually logs a few more "connect ECONNREFUSED" lines while
    # the Service has no endpoint at all. What changes is that everything which
    # reads readiness now tells the truth: helm --wait, Argo CD health, and
    # anything else that treats the database as a dependency.
    # -- MySQL readiness probe.
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    # Deliberately slack. Restarting a database because it was busy is worse
    # than leaving it alone, so this only fires after 90s of no answer, and only
    # once the startup probe has already succeeded. Set enabled to false if you
    # would rather it never restarted the database at all.
    # -- MySQL liveness probe, deliberately slack.
    liveness:
      enabled: true
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3

    # ===================================================
    # EXTRAS, same shape as the server further down
    # ===================================================
    # -- Extra env entries for the MySQL container.
    extraEnv: []
    #   - name: MYSQL_INITDB_SKIP_TZINFO
    #     value: "1"
    # -- ConfigMaps or Secrets injected as environment into the MySQL container.
    extraEnvFrom: []
    # -- Extra volumes on the MySQL pod.
    extraVolumes: []
    # -- Extra volume mounts in the MySQL container.
    extraVolumeMounts: []
    # -- Init containers for the MySQL pod.
    initContainers: []

    # ===================================================
    # SECURITY CONTEXT
    # ===================================================
    # These defaults satisfy the restricted Pod Security Standard, which several
    # managed distributions now enforce by default and which the chart used to
    # fail outright.
    #
    # The image normally starts as root only to take ownership of the data
    # directory and then steps down to uid 999. fsGroup makes the kubelet do
    # that instead, so the container never needs to be root at all.
    # OnRootMismatch means the ownership pass is skipped when the top of the
    # volume already looks right, which keeps a restart cheap on a large
    # database and leaves a volume from an older release alone: the old
    # entrypoint already chowned it to 999:999.
    #
    # To go back to no pod security context at all, which is what a volume on
    # NFS with root_squash may need, set the whole map to null. Not to {}: Helm
    # merges your values file over this one, and an empty map merges to exactly
    # what is written here. Only null removes a key.
    # -- MySQL pod security context. Set to null together with securityContext to drop both.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    # -- MySQL container security context.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

# ~~~~

  server:
    # -- AnsibleForms image.
    image: ghcr.io/ansibleforms/ansibleforms:7.3.0
    # One pod or none. Each server pod runs the whole of AnsibleForms (the app, the
    # worker and the scheduler, AF_ROLE all) and its own RTE on the one shared volume,
    # and the chart does not split those roles over Deployments of their own, so a
    # second pod would not be a replica of the first. The schema refuses more than 1.
    # -- Server replicas, 0 or 1. Each pod runs the whole app and its own RTE; 0 stops it.
    replicas: 1

    # Accepts either "Recreate" / "RollingUpdate" or the Kubernetes shape
    # ({type: Recreate}).
    #
    # Recreate, because the server and its persistent volume are shared and two
    # pods alive at once means two schedulers and two seed runs against the same
    # database. This used to say RollingUpdate immediately under a comment
    # arguing for Recreate, and with replicas at 1 and the default maxSurge of
    # 25% Kubernetes rounds up to one extra pod, so every single rollout really
    # did run two AnsibleForms against the same database for a few seconds.
    #
    # The cost is that a rollout now has a gap instead of an overlap. With one
    # replica sharing one volume there was never a real overlap to keep.
    # -- Deployment strategy, Recreate or RollingUpdate (or the Kubernetes shape).
    strategy: "Recreate"

    # Written into the pod template, so changing them triggers a rollout. Handy
    # for a checksum annotation when the forms ConfigMap changes.
    # -- Extra annotations on the server pod; changing them triggers a rollout.
    podAnnotations: {}

    # Extra labels on the pod only, on top of commonLabels.
    # -- Extra labels on the server pod.
    podLabels: {}

    # ===================================================
    # WHERE THIS POD IS ALLOWED TO RUN
    # ===================================================
    # Plain Kubernetes, passed through as written. All optional and all empty
    # by default, so nothing changes unless you set them.
    # -- Server pod nodeSelector.
    nodeSelector: {}
    #   kubernetes.io/hostname: node-1
    # -- Server pod tolerations.
    tolerations: []
    #   - key: workload
    #     operator: Equal
    #     value: apps
    #     effect: NoSchedule
    # -- Server pod affinity.
    affinity: {}
    #   nodeAffinity:
    #     requiredDuringSchedulingIgnoredDuringExecution:
    #       nodeSelectorTerms:
    #         - matchExpressions:
    #             - key: kubernetes.io/arch
    #               operator: In
    #               values: [amd64]
    # -- Server pod topology spread constraints.
    topologySpreadConstraints: []
    # -- Server pod priority class.
    priorityClassName: ''

    # Overrides the release wide imagePullSecrets for this image alone.
    # -- Pull secrets for the AnsibleForms image only; overrides imagePullSecrets.
    imagePullSecrets: []

    # The chart does not create a ServiceAccount. Name one you manage yourself,
    # otherwise the namespace's "default" is used.
    # -- Existing ServiceAccount for the server pod. Empty uses the namespace default.
    serviceAccountName: ''

    # A terminal on a server process is not useful and keeps stdin open.
    # -- Keep stdin open on the server container.
    stdin: false
    # -- Allocate a TTY for the server container.
    tty: false

    # The app listens on 80 or 443, both privileged, while the container runs
    # as an unprivileged user. A pod network namespace always starts with
    # net.ipv4.ip_unprivileged_port_start at 1024, whatever the node says, so
    # without this the process dies with "listen EACCES: permission denied".
    # The sysctl is on the kubelet's safe list and allowed under the restricted
    # pod security standard. Set it to false only if your kubelet refuses the
    # sysctl, and then serve the app on a port above 1024.
    # -- Let the non-root server bind ports 80 and 443 (sets net.ipv4.ip_unprivileged_port_start).
    bindPrivilegedPorts: true
    # -- Server container resources.
    resources:
      limits:
        cpu: '4'
        memory: 4096Mi
      requests:
        cpu: '1'
        memory: 1024Mi
    # There used to be a "prepare-persistent-volume" init container here that ran
    # as root purely to chown the volume to 1000:1000. podSecurityContext.fsGroup
    # below now asks the kubelet to do the same thing, which is both cheaper and
    # the only way the pod can run where the restricted Pod Security Standard is
    # enforced: a container with runAsUser 0 is refused outright there.
    #
    # Put it back only if your storage ignores fsGroup, and know that doing so
    # gives up on the restricted standard.
    # -- Init containers for the server pod.
    initContainers: []

    # ===================================================
    # SECURITY CONTEXT
    # ===================================================
    # Pod level, so it covers the container and anything you add to
    # initContainers. Together with the container level context the chart sets
    # further down, this is what makes the release installable in a namespace
    # with pod-security.kubernetes.io/enforce=restricted.
    #
    # sysctls are added by the chart when bindPrivilegedPorts is on, and are
    # left alone if you set your own here. net.ipv4.ip_unprivileged_port_start
    # is on the kubelet's safe list and is permitted under restricted, which is
    # what lets the application keep listening on 80 or 443.
    #
    # To go back to no pod security context at all, set the whole map to null.
    # Not to {}: Helm merges your values file over this one, and an empty map
    # merges to exactly what is written here. Only null removes a key.
    # -- Server pod security context. Set to null together with securityContext to drop both.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  # ==============================================================================
  # LIVENESS / READINESS CONFIGURATION
  # ==============================================================================
    # The startup probe covers the first boot, when the database migrations run
    # and the app can take minutes to answer. Until it succeeds the liveness
    # probe is not evaluated, which is what stops the restart loop people hit on
    # a fresh install. failureThreshold x periodSeconds is the budget, 300s here.
    #
    # The paths are the app's own probe endpoints, which need no login:
    # /api/v2/live answers while the process runs, /api/v2/ready once the
    # database answers and the schema is complete (and no longer while the app
    # stops). With BASE_URL set the chart puts it in front of each path, so leave
    # it out here.
    # -- Server startup probe (HTTP). The path is relative to BASE_URL.
    startup:
      enabled: true
      path: /api/v2/ready
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

    # -- Server liveness probe (HTTP). The path is relative to BASE_URL.
    liveness:
      path: /api/v2/live
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 3
    # -- Server readiness probe (HTTP). The path is relative to BASE_URL.
    readiness:
      path: /api/v2/ready
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 3

  # ===================================================
  # EXTRA ENVIRONMENT
  # ===================================================
  # Plain Kubernetes env entries, for anything applications.server.env cannot
  # express: a value read from another Secret or ConfigMap, or from the
  # downward API. Written after the generated variables, so it wins.
    # -- Extra env entries for the server, written after the generated ones so they win.
    extraEnv: []
    #   - name: ENV
    #     value: production
    #   - name: SOME_TOKEN
    #     valueFrom:
    #       secretKeyRef:
    #         name: my-other-secret
    #         key: token

  # Whole ConfigMaps or Secrets injected as environment at once.
    # -- ConfigMaps or Secrets injected as environment into the server.
    extraEnvFrom: []
    #   - configMapRef:
    #       name: ansibleforms-extra-config
    #   - secretRef:
    #       name: ansibleforms-extra-secrets

  # ===================================================
  # ENABLE THIS FOR CUSTOM COMMANDS
  # ===================================================
    # customCommand:
    #   command: ["/bin/sh", "-c"]
    #   args:
    #   - "node ./index.js"

  # ===================================================
  # ENABLE THIS FOR CUSTOM CA CERTS
  # ===================================================
    # extraVolumeMounts:
    #   - name: ca-certs-configmap
    #     mountPath: /etc/custom-certs/custom-ca.crt
    #     subPath: custom-ca.crt
    #     readOnly: true

# ~~~~

  # The RTE, the runtime environment that runs the playbooks. It is a second container in
  # the server pod rather than a Deployment of its own: it needs the app's volume (the
  # playbooks, repositories, uploads and SSH key), and the volume is ReadWriteOnce. The app
  # dials it on 127.0.0.1 and keeps one WebSocket open (inbound): the RTE gets no database
  # settings. No Service publishes its port, but it listens on the pod's address like any
  # container, so other pods can reach it there: its socket needs the token, /live and
  # /ready answer anybody, and /metrics only with METRICS_TOKEN.
  # networkPolicy.server keeps other pods to the app's port.
  #
  # The image is where your playbooks' dependencies live: collections, Python libraries,
  # ansible.cfg. The app publishes the RTE in layers: ansibleforms-rte-full (the default),
  # and ansibleforms-rte-core to build a smaller one with only what your playbooks use. Its
  # examples/rte folder has Dockerfiles to start from; point image at what you build.
  rte:
    # -- Run the RTE next to the app. Without it, playbook forms need a runner added by hand.
    enabled: true
    # -- AnsibleForms RTE image. Keep it on the app's release, or one with the same RTE contract.
    image: ghcr.io/ansibleforms/ansibleforms-rte-full:7.3.0
    # -- RTE image pull policy.
    imagePullPolicy: IfNotPresent
    # -- Port the RTE listens on inside the pod. Any free port above 1024.
    port: 8000

    # The chart registers the RTE with the app through a config seed: an RTE credential with
    # the token and http://127.0.0.1:<port>, and a runner named after runnerName, type rte,
    # mode inbound, signing in with it, ticked as the default. The seed re-applies them on
    # every start, so they are read-only in the interface.
    #
    # With seedRunner off, or a config seed of your own (CONFIG_SEED_PATH set in
    # applications.server.env or containers.server.extraEnv), add the runner yourself: in
    # your seed (the chart's NOTES show how, with password: ${RTE_TOKEN}), or under
    # Connections > Runners with an RTE credential holding that address and the token.
    # -- Register the RTE as the app's default runner through a config seed. Off, add the runner yourself (the NOTES show how).
    seedRunner: true
    # -- Name of the runner the seed creates.
    runnerName: rte

    # A Secret you manage yourself that holds the token, for Argo CD and Flux, which render
    # without a cluster to read: the chart refuses to generate a token there.
    # -- Existing Secret holding the RTE token. Empty uses the <release>-keys Secret.
    existingTokenSecret: ''
    # -- Key of the token in existingTokenSecret.
    existingTokenSecretKey: RTE_TOKEN

    # A playbook runs here, not in the app, so this is the container that needs room.
    # -- RTE resources.
    resources:
      limits:
        cpu: '2'
        memory: 2048Mi
      requests:
        cpu: 250m
        memory: 256Mi

    # The RTE's /ready and /live need no token, unlike its socket. The startup probe asks
    # /ready, which answers as soon as the RTE listens: inbound, it reads no database. The
    # budget, 300s here, leaves room for a slow image pull or a slow node. The liveness
    # probe asks /live. There is no readiness probe on purpose: the app keeps
    # serving while the RTE restarts, and a job started then fails with a reason.
    # -- RTE startup probe (HTTP /ready); failureThreshold x periodSeconds is the budget.
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60
    # -- RTE liveness probe (HTTP /live).
    liveness:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

    # -- Extra env entries for the RTE, written after the generated ones so they win.
    extraEnv: []
    # -- ConfigMaps or Secrets injected as environment into the RTE.
    extraEnvFrom: []
    # Mounts of the volumes in extraVolumes: custom CA certificates, an ansible.cfg, a
    # folder of playbooks of your own.
    # -- Extra volume mounts for the RTE.
    extraVolumeMounts: []

# ~~~~


# ==============================================================================
# FORMS CONFIGURATION
# ==============================================================================
# AnsibleForms 7 reads categories, roles and constants from config.yaml, and the
# forms themselves only from the forms folder, one or more forms per file. A
# forms: section in config.yaml is an error in 7. Each key of the
# extraFormsConfigMap becomes a file in that folder.
forms:
  configMap:
    # -- Mount config.yaml (categories, roles, constants) from a ConfigMap.
    enabled: false
    # -- Key in the ConfigMap that holds config.yaml.
    key: config.yaml
    # -- Where config.yaml is mounted.
    mountPath: /app/dist/persistent/config.yaml
    # -- Name of the ConfigMap holding config.yaml.
    name: ''
  customJs:
    # -- Mount custom.js from a ConfigMap.
    enabled: false
    # -- Key in the ConfigMap that holds custom.js.
    key: custom.js
    # -- Where custom.js is mounted.
    mountPath: /app/dist/src/functions/custom.js
    # -- Name of the ConfigMap holding custom.js.
    name: ''
  extraFormsConfigMap:
    # -- Mount the form files (one or more forms per key) from a ConfigMap.
    enabled: false
    # -- The forms folder they are mounted as.
    mountPath: /app/dist/persistent/forms
    # -- Name of the ConfigMap holding the form files.
    name: ''

# ==============================================================================
# NETWORK POLICY
# ==============================================================================
# Off by default, and not only out of caution: NetworkPolicy is enforced by the
# CNI, and several common ones do not enforce it at all. Flannel is the usual
# example. A policy that nothing enforces is worse than no policy, because it
# looks like protection in `kubectl get netpol` and is not.
#
# What `enabled` gives you is a policy on the bundled MySQL: nothing may open a
# connection to it except the AnsibleForms server of the same release. Egress is
# left alone everywhere, since the server has to reach whatever your playbooks
# talk to, and guessing that list would break more than it protects.
networkPolicy:
  # -- Only the server of this release may connect to the bundled MySQL. Needs a CNI that enforces NetworkPolicy.
  enabled: false

  # Extra peers allowed to reach MySQL, as plain NetworkPolicyPeer entries. For
  # a backup job, or a tool you run by hand.
  # -- Extra NetworkPolicyPeer entries allowed to reach MySQL.
  mysqlExtraFrom: []
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: backups

  # A policy for the server as well. This one needs telling who may connect,
  # because an ingress controller lives in its own namespace and which one
  # differs per cluster. With `from` empty the policy would let nothing in at
  # all, so the chart refuses to render that rather than cutting you off.
  server:
    # -- Also restrict who may connect to the server.
    enabled: false
    # -- NetworkPolicyPeer entries allowed to reach the server; required when the server policy is on.
    from: []
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: ingress-nginx

# ==============================================================================
# ROLLING WHEN THE CONFIGURATION CHANGES
# ==============================================================================
# A pod reads its configuration once, when it starts. Change the Secret and the
# running process keeps the environment it was given; change the my.cnf
# ConfigMap and the file inside the container does not move at all, because it
# is mounted with subPath and subPath mounts are frozen at pod creation.
#
# Measured on a live release before this existed: the ConfigMap asked for
# innodb_buffer_pool_size 256M, the file in the pod still read "[mysqld]" and
# MySQL was running on the 128M default, with no indication anything was wrong.
#
# With this on, a checksum of what the chart renders goes into the pod template,
# so a configuration change becomes an ordinary rollout.
rollOnChange:
  # The objects the chart renders itself: the generated Secret and the MySQL
  # my.cnf. Always deterministic, since the checksum comes from the templates.
  # -- Roll the pods when the generated Secret or my.cnf changes.
  enabled: true

  # The objects it does not: a Secret supplied through secrets.existingSecret,
  # and the ConfigMaps under `forms` holding config.yaml, the form files
  # and custom.js. Seeing those means reading them from the cluster, and that
  # returns nothing during `helm template`, so anything rendering first and
  # applying afterwards, Argo CD and Flux included, would get a checksum that
  # does not match the one an install produces.
  #
  # Turn it on if you drive the chart with helm directly and want a config.yaml
  # change to restart the server on the next upgrade.
  # -- Also roll on changes to secrets.existingSecret and the forms ConfigMaps. Not under helm template, Argo CD or Flux.
  external: false

# ==============================================================================
# HELM TEST
# ==============================================================================
# The pod `helm test` runs. It fetches the front page through the Service and
# checks the page is really AnsibleForms rather than something else answering
# 200, then opens a connection to the database. `ct install` runs it in CI after
# every install.
#
# It carries the same security context as the rest of the chart, so it is
# accepted where the restricted Pod Security Standard is enforced. A test pod
# the namespace refuses would fail `helm test` for a reason that has nothing to
# do with the release.
tests:
  # -- Render the helm test pod.
  enabled: true
  # -- Image of the helm test pod.
  image: curlimages/curl:8.10.1
  # The uid the image already runs as. Change it with the image.
  # -- UID the test pod runs as; change it with the image.
  runAsUser: 100
  # -- GID the test pod runs as.
  runAsGroup: 100
  # The test pod is scheduled like anything else, so on a cluster where the
  # nodes are tainted it needs to be told the same things the other two are.
  # -- Test pod nodeSelector.
  nodeSelector: {}
  # -- Test pod tolerations.
  tolerations: []
  # -- Test pod affinity.
  affinity: {}
  # -- Pull secrets for the test image.
  imagePullSecrets: []

# ==============================================================================
# SECRETS
# ==============================================================================
# By default the chart creates a Secret named <release>-secrets from the values
# above. Point existingSecret at a Secret you manage instead, and the chart will
# not create or touch one: use it with External Secrets, Sealed Secrets, SOPS,
# or anything else that puts credentials in the cluster without them passing
# through values.yaml.
#
# The Secret must carry these five keys:
#   DB_USER, DB_PASSWORD, ENCRYPTION_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD
#
# applications.mysql.password and the sensitive entries under
# applications.server.env can then be left out entirely.
secrets:
  # -- Use this existing Secret instead of creating one. Needs DB_USER, DB_PASSWORD, ENCRYPTION_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD.
  existingSecret: ''

  # Make up whatever is not supplied, instead of refusing to render. Off by
  # default, because it only works where the chart can read the cluster.
  #
  # On a first install it generates what is missing; on every upgrade after that
  # it reads back what it wrote and leaves it alone, so the values are stable.
  # ENCRYPTION_SECRET is generated at exactly 32 characters, which is what the
  # application uses as an aes-256 key. Shorter and it pads the rest with a
  # constant out of its own source code, so a ten character secret is ten
  # characters of secret and twenty-two of public knowledge; longer and the
  # remainder is cut off and never counts.
  #
  # It refuses to run under `helm template`, and therefore under Argo CD and
  # Flux, because there is no cluster to read and it would mint a different
  # secret on every render. ENCRYPTION_SECRET is not a password you can reset:
  # it is the key stored credentials are encrypted with, aes-256-ctr does not
  # authenticate, and decrypting with the wrong key returns rubbish instead of
  # an error.
  #
  # For GitOps, keep the credentials in a Secret of their own and point
  # existingSecret at it. External Secrets with Vault, Sealed Secrets and SOPS
  # all fit that shape, and the chart never touches a Secret it did not make.
  #
  # The generated Secret is annotated helm.sh/resource-policy: keep, so
  # `helm uninstall` leaves it behind and a reinstall picks the same values back
  # up rather than quietly making the old data unreadable. Delete it by hand
  # when you really do mean to start over.
  # -- Generate missing credentials on install and keep them on upgrades. Refuses to run under helm template.
  generate: false

# ==============================================================================
# INGRESS CONFIGURATION
# ==============================================================================
# Behind the Ingress every connection reaches the app from the ingress controller,
# so the app would take the controller's address for every user: the audit trail
# would name it, and the per-address sign-in limits (LOGIN_MAX_FAILURES_PER_IP,
# AUTH_RATE_LIMIT) would hold back everybody at once. With the Ingress on and the
# server Service a ClusterIP, the chart therefore sets TRUST_PROXY=1: the app reads
# the client's address from the X-Forwarded-For entry the controller adds, which a
# client cannot choose.
#
# One hop is one controller. With a load balancer that adds its own entry in front
# of it, set TRUST_PROXY to 2, or to the proxies' addresses, under
# applications.server.env; "0" there turns it off. With a NodePort or LoadBalancer
# Service clients can reach the app without the controller, so the chart sets
# nothing: set TRUST_PROXY to the controller's addresses yourself.
ingress:
  # -- Annotations on the Ingress.
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  # -- IngressClass name.
  className: nginx
  # -- Create an Ingress. With a ClusterIP Service it also sets TRUST_PROXY=1 unless applications.server.env sets it.
  enabled: true
  # -- Extra annotations on the Ingress, merged with ingress.annotations.
  extraAnnotations: {}
  # -- Additional hostnames.
  extraHosts: []
  # -- Additional paths.
  extraPaths: []
  # -- Hostname the Ingress answers on.
  hostname: <YOUR INGRESS URL>
  # -- Path of the Ingress rule.
  path: /
  # -- pathType of the Ingress rule.
  pathType: Prefix
  tls:
    # -- Enable TLS on the Ingress.
    enabled: true

# ==============================================================================
# SERVICES CONFIGURATION
# ==============================================================================
services:
# ~~~~
  mysql:
    # -- MySQL Service type.
    type: ClusterIP
    # -- Annotations on the MySQL Service.
    annotations: {}
# ~~~~
  server:
    # -- Server Service type: ClusterIP, NodePort or LoadBalancer.
    type: ClusterIP
    # Annotations on the Service, not on the Ingress. Traefik reads its
    # service.* settings from here, which is where you tell it to speak TLS to
    # the backend when applications.server.env.HTTPS is 1:
    #
    #   annotations:
    #     traefik.ingress.kubernetes.io/service.serversscheme: https
    #
    # The application serves a self-signed certificate, so traefik also needs a
    # ServersTransport with insecureSkipVerify, referenced from here:
    #
    #     traefik.ingress.kubernetes.io/service.serverstransport: <ns>-<name>@kubernetescrd
    #
    # On ingress-nginx the equivalent lives on the Ingress instead, as
    # ingress.extraAnnotations:
    #
    #     nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    # -- Annotations on the server Service (for example traefik backend settings).
    annotations: {}
# ~~~~

# ==============================================================================
# STORAGE CONFIGURATION
# ==============================================================================
storages:
# ~~~~
  mysql:
    # -- StorageClass for the MySQL volume. Empty uses the cluster default.
    className: ''
    # -- Size of the MySQL volume.
    size: 10Gi
    # ReadWriteMany is the default the chart has always used. Plenty of storage
    # classes only offer ReadWriteOnce, and with a single replica that is fine.
    # -- Access mode of the MySQL volume. ReadWriteOnce is fine with one replica.
    accessMode: ReadWriteMany
    static:
      # -- Bind the MySQL claim to a pre-created PersistentVolume.
      enabled: false
      # -- storageClassName of that PersistentVolume.
      storageClassName: ''
      # -- Name of that PersistentVolume.
      volumeName: ''
# ~~~~
  server:
    # -- StorageClass for the server volume. Empty uses the cluster default.
    className: ''
    # -- Size of the server volume.
    size: 10Gi
    # -- Access mode of the server volume. ReadWriteOnce is fine with one replica.
    accessMode: ReadWriteMany
    static:
      # -- Bind the server claim to a pre-created PersistentVolume.
      enabled: false
      # -- storageClassName of that PersistentVolume.
      storageClassName: ''
      # -- Name of that PersistentVolume.
      volumeName: ''
# ~~~~

