{{- /*
  The keys the chart generates for the app itself, kept apart from <release>-secrets so a
  Secret managed outside the chart (secrets.existingSecret) never needs a new key to
  upgrade. Each one is taken from values when given, else read back from the cluster, else
  generated once:

  ACCESS_TOKEN_SECRET signs the sessions. Without it the app makes one up at every start
  and signs everybody out on each restart. Left out when containers.server.extraEnv sets it.
  RTE_TOKEN is what the app sends the RTE with every call. Left out with
  containers.rte.existingTokenSecret, or without the RTE.

  Generating needs a cluster to read back what was generated before. Without one (helm
  template, and so Argo CD and Flux) every render would make new ones, and each sync would
  write them into the Secret. The pod reads it only when a container starts, so the first
  container to restart alone would hold another RTE_TOKEN than the other, and every job
  would be refused with a 401 until the whole pod restarts. So the chart refuses to generate
  there, as secrets.generate does, and asks for the values instead.
*/}}
{{- $appEnv := ((.Values.applications | default dict).server | default dict).env | default dict }}
{{- $rteOn := eq (include "ansibleforms.rte.enabled" .) "true" }}
{{- $ownToken := and $rteOn (not (dig "rte" "existingTokenSecret" "" (.Values.containers | default dict))) }}
{{- $givenToken := toString (dig "rte" "token" "" (.Values.applications | default dict)) }}
{{- if and $ownToken $givenToken (lt (len $givenToken) 16) }}
{{- fail (printf "\n\napplications.rte.token is %d characters. The RTE refuses to start with a token shorter than 16.\n\nGive it a longer one, or leave it empty and the chart generates one.\n" (len $givenToken)) }}
{{- end }}
{{- $given := dict }}
{{- with (toString ($appEnv.ACCESS_TOKEN_SECRET | default "")) }}{{ $_ := set $given "ACCESS_TOKEN_SECRET" . }}{{ end }}
{{- if and $ownToken $givenToken }}{{ $_ := set $given "RTE_TOKEN" $givenToken }}{{ end }}
{{- $keys := list }}
{{- if eq (include "ansibleforms.sessionKeyOwned" .) "true" }}{{ $keys = append $keys "ACCESS_TOKEN_SECRET" }}{{ end }}
{{- if $ownToken }}{{ $keys = append $keys "RTE_TOKEN" }}{{ end }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "ansibleforms.keysSecretName" .)) }}
{{- $existingData := (($existing).data) | default dict }}
{{- /* Asking for something that always exists tells whether there is a cluster to read */}}
{{- $canLookUp := (lookup "v1" "Namespace" "" "kube-system") }}
{{- $paths := dict "ACCESS_TOKEN_SECRET" "applications.server.env.ACCESS_TOKEN_SECRET (or an ACCESS_TOKEN_SECRET entry in containers.server.extraEnv, read from a Secret of your own)" "RTE_TOKEN" "applications.rte.token, 16 characters or more (or containers.rte.existingTokenSecret, a Secret of your own holding it)" }}
{{- $missing := list }}
{{- range $key := $keys }}
{{- if and (not (hasKey $given $key)) (not (hasKey $existingData $key)) }}
{{- $missing = append $missing (index $paths $key) }}
{{- end }}
{{- end }}
{{- if and $missing (not $canLookUp) }}
{{- fail (printf "\n\nThe chart generates the <release>-keys Secret once and reads it back on every upgrade, but this is being rendered without a cluster to read (helm template, so Argo CD and Flux too).\n\nGenerating here would make new keys on every render, written into the Secret on every sync. A container reads them only when it starts, so after one restart the app and the RTE would hold different RTE_TOKENs and every job would be refused with a 401, and a new ACCESS_TOKEN_SECRET signs everybody out.\n\nSet them instead:\n\n  %s\n\nOr install with helm directly, where the chart reads back what it generated.\n" (join "\n  " $missing)) }}
{{- end }}
{{- if $keys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ansibleforms.keysSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansibleforms.server.labels" . | nindent 4 }}
  {{- with (include "ansibleforms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key := $keys }}
  {{- if hasKey $given $key }}
  {{ $key }}: {{ index $given $key | b64enc }}
  {{- else if hasKey $existingData $key }}
  {{ $key }}: {{ index $existingData $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum (ternary 64 32 (eq $key "ACCESS_TOKEN_SECRET")) | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
