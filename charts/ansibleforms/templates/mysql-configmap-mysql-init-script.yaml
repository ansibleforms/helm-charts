{{- if dig "enabled" true (.Values.mysql | default dict) }}
{{- /*
  Only the grant. AnsibleForms 7 creates its own schema when it finds an empty
  database, so the chart no longer ships one: a copy kept here went stale with
  every release that added a table. MySQL only runs anything in
  /docker-entrypoint-initdb.d when the data directory is empty, so this is a
  first-boot affair.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ansibleforms.mysql.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansibleforms.mysql.labels" . | nindent 4 }}
  {{- with (include "ansibleforms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- $dbUser := include "ansibleforms.dbUser" . }}
  init.sql: |
    {{- if or (not $dbUser) (eq $dbUser "root") }}
    -- AnsibleForms connects as root : the bundled server starts with a root
    -- account restricted to localhost, and AnsibleForms connects over the
    -- network from another pod.
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
    {{- else }}
    -- AnsibleForms connects as {{ $dbUser }}, which the image creates from
    -- MYSQL_USER with rights on the AnsibleForms schema only : nothing to grant.
    SELECT 1;
    {{- end }}
{{- end }}
