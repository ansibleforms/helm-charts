{{- /* The app's, so nothing in runner mode (runner.enabled): the app runs elsewhere */}}
{{- if ne (include "ansibleforms.runner.enabled" .) "true" }}

{{- $containers := (.Values.containers | default dict) }}
{{- $app := (.Values.applications | default dict) }}
{{- $server := ($containers.server | default dict) }}
{{- $liveness := ($server.liveness | default dict) }}
{{- $readiness := ($server.readiness | default dict) }}
{{- $resources := ($server.resources | default dict) }}
{{- $startup := ($server.startup | default dict) }}
{{- /*
  strategy accepts either a plain string ("Recreate") or the Kubernetes shape
  ({type: Recreate}). Without this the map form used to render as
  "type: map[type:Recreate]".
*/}}
{{- $strategyType := "RollingUpdate" }}
{{- if kindIs "string" $server.strategy }}
  {{- $strategyType = $server.strategy }}
{{- else if kindIs "map" $server.strategy }}
  {{- $strategyType = (dig "type" "RollingUpdate" $server.strategy) }}
{{- end }}
{{- $limits := ($resources.limits | default dict) }}
{{- $requests := ($resources.requests | default dict) }}
{{- $appServer := ($app.server | default dict) }}
{{- $appEnv := ($appServer.env | default dict) }}
{{- $appMysql := ($app.mysql | default dict) }}
{{- $cmd := ($server.customCommand | default dict) }}
{{- /*
  Credentials come either from the Secret the chart generates or from one that
  already exists, managed by External Secrets, Sealed Secrets or anything else.
  Both cases expose the same five keys, so only the name changes here.
*/}}
{{- $secretName := include "ansibleforms.secretName" . }}
{{- /*
  The listening port and its scheme come from a helper so the container, the
  Service and the three probes cannot drift apart.
*/}}
{{- $port := include "ansibleforms.server.port" . }}
{{- $scheme := include "ansibleforms.server.scheme" . }}
{{- $sensitive := dict "ENCRYPTION_SECRET" true "ADMIN_USERNAME" true "ADMIN_PASSWORD" true "ACCESS_TOKEN_SECRET" true }}
{{- $rteOn := eq (include "ansibleforms.rte.enabled" .) "true" }}
{{- $seedOn := eq (include "ansibleforms.rte.seedEnabled" .) "true" }}
{{- $rte := ($containers.rte | default dict) }}
{{- $rteResources := ($rte.resources | default dict) }}
{{- $rteLimits := ($rteResources.limits | default dict) }}
{{- $rteRequests := ($rteResources.requests | default dict) }}
{{- $rteStartup := ($rte.startup | default dict) }}
{{- $rteLiveness := ($rte.liveness | default dict) }}
{{- $rtePort := include "ansibleforms.rte.port" . }}
{{- $basePath := include "ansibleforms.server.basePath" . }}

{{- include "ansibleforms.assertNoRootInitContainer" (dict "component" $server "key" "server") }}
{{- include "ansibleforms.assertSecurityContextsAgree" (dict "component" $server "key" "server") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ansibleforms.server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansibleforms.server.labels" . | nindent 4 }}
  {{- with (include "ansibleforms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- /* hasKey, not default: 0 is a value here, and default would turn it into 1 */}}
  replicas: {{ if hasKey $server "replicas" }}{{ $server.replicas | int }}{{ else }}1{{ end }}
  {{- /* The selector is immutable on an existing Deployment, leave it alone */}}
  selector:
    matchLabels:
      {{- include "ansibleforms.server.selectorLabels" . | nindent 6 }}

  strategy:
    type: {{ $strategyType }}

  template:
    metadata:
      labels:
        {{- include "ansibleforms.server.labels" . | nindent 8 }}
        {{- with $server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- /* podAnnotations wins over commonAnnotations on a clash */}}
      {{- /* Most specific wins: podAnnotations, then commonAnnotations, then the
             checksums the chart works out for itself. */}}
      {{- $checksums := fromYaml (include "ansibleforms.ownedConfigChecksums" (dict "root" $ "withForms" true)) }}
      {{- $podAnn := merge (dict) ($server.podAnnotations | default dict) (.Values.commonAnnotations | default dict) $checksums }}
      {{- /* Two containers now: kubectl logs and exec land on the app unless told otherwise */}}
      {{- if $rteOn }}
      {{- $podAnn = merge $podAnn (dict "kubectl.kubernetes.io/default-container" "server") }}
      {{- end }}
      {{- with $podAnn }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $server.serviceAccountName | default "default" }}

      {{- with (include "ansibleforms.podScheduling" (dict "component" $server "root" $)) }}
      {{- . | nindent 6 }}
      {{- end }}

      {{- /*
        The app listens on 80 or 443. Both are privileged ports, the container
        runs as an unprivileged user, and a pod network namespace starts with
        net.ipv4.ip_unprivileged_port_start at 1024 no matter what the node is
        set to. Adding NET_BIND_SERVICE is not enough either: the process is
        already non-root at exec, so the capability lands in the bounding set
        and never reaches the effective one. Lowering the sysctl is what
        actually works. It has been on the kubelet's safe list since 1.21 and
        is allowed under the restricted pod security standard.
        Set bindPrivilegedPorts to false if your kubelet refuses it, and expose
        the app on a port above 1024 instead.

        The rest of the pod security context comes from values, not from here,
        so that overriding a field to false actually takes: Helm merges values
        files properly, while the template's own merge treats false as absent
        and would quietly put the default back. The sysctls are only added when
        you have not written your own.
      */}}
      {{- $podSec := ($server.podSecurityContext | default dict) }}
      {{- if and (or (not (hasKey $server "bindPrivilegedPorts")) $server.bindPrivilegedPorts) (not $podSec.sysctls) }}
      {{- $podSec = merge (dict "sysctls" (list (dict "name" "net.ipv4.ip_unprivileged_port_start" "value" "0"))) $podSec }}
      {{- end }}
      {{- with $podSec }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}


      {{- if $server.initContainers }}
      initContainers:
{{ toYaml $server.initContainers | nindent 8 }}
      {{- end }}

      containers:
        - name: server
          image: {{ $server.image | required "containers.server.image is required" }}
          imagePullPolicy: {{ $server.imagePullPolicy | default "IfNotPresent" }}

          {{- if $cmd.command }}
          command:
{{ toYaml $cmd.command | nindent 12 }}
          {{- end }}

          {{- if $cmd.args }}
          args:
{{ toYaml $cmd.args | nindent 12 }}
          {{- end }}

          ports:
            {{- /* Named so the Service and the Ingress can point at it by name */}}
            - name: http
              containerPort: {{ $port }}
              protocol: TCP

          env:
            - name: PORT
              value: {{ $port | quote }}

            {{- range $key, $value := $appEnv }}
            {{- if not (index $sensitive $key) }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
            {{- end }}

            {{- /* The client's address behind the Ingress, see the helper */}}
            {{- if eq (include "ansibleforms.server.trustProxyDefault" .) "true" }}
            - name: TRUST_PROXY
              value: "1"
            {{- end }}

            {{- /*
              The bundled MySQL Service is named after the release now, so the
              default cannot be the literal "mysql" any more.
            */}}
            - name: DB_HOST
              value: {{ include "ansibleforms.mysql.host" . | quote }}

            - name: DB_PORT
              value: {{ $appMysql.port | default "3306" | quote }}

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_PASSWORD

            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ENCRYPTION_SECRET

            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ADMIN_USERNAME

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ADMIN_PASSWORD

            {{- /* Signs the sessions, so they survive a restart. From extraEnv when it sets it. */}}
            {{- if eq (include "ansibleforms.sessionKeyOwned" .) "true" }}
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ansibleforms.keysSecretName" . }}
                  key: ACCESS_TOKEN_SECRET
            {{- end }}

            {{- if $rteOn }}
            {{- /*
              Not read by the app itself: it is there for the config seed, which writes the
              runner's token as ${RTE_TOKEN}. The chart's seed does, and so can yours.
            */}}
            - name: RTE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ansibleforms.rte.tokenSecretName" . }}
                  key: {{ include "ansibleforms.rte.tokenSecretKey" . }}
            {{- end }}

            {{- if $seedOn }}
            - name: CONFIG_SEED_PATH
              value: /etc/ansibleforms/seed/seed.yaml
            {{- end }}

            {{- /*
              Anything applications.server.env cannot express: values read from
              another Secret or ConfigMap, from the downward API, or a variable
              whose name would collide with the ones above. Written last, so it
              wins over the generated entries.
            */}}
            {{- with $server.extraEnv }}
{{ toYaml . | nindent 12 }}
            {{- end }}

          {{- /* Whole ConfigMaps or Secrets injected as environment */}}
          {{- with $server.extraEnvFrom }}
          envFrom:
{{ toYaml . | nindent 12 }}
          {{- end }}

          resources:
            limits:
              cpu: {{ $limits.cpu | default "500m" }}
              memory: {{ $limits.memory | default "512Mi" }}
            requests:
              cpu: {{ $requests.cpu | default "250m" }}
              memory: {{ $requests.memory | default "256Mi" }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: {{ $server.runAsUser | default 1000 }}
            runAsGroup: {{ $server.runAsGroup | default 1000 }}
            capabilities:
              drop:
                - ALL
              {{- /*
                The app listens on 80 or 443, both privileged, while the
                container runs as an unprivileged user with every capability
                dropped. Some clusters set net.ipv4.ip_unprivileged_port_start
                to 0 and it works anyway; the ones that do not just get
                "listen EACCES: permission denied 0.0.0.0:80" and a pod that
                never comes up. NET_BIND_SERVICE is the narrow fix.
              */}}
              add:
                - NET_BIND_SERVICE

          stdin: {{ if hasKey $server "stdin" }}{{ $server.stdin }}{{ else }}false{{ end }}
          tty: {{ if hasKey $server "tty" }}{{ $server.tty }}{{ else }}false{{ end }}

          {{- /*
            The startup probe holds the liveness probe back while the database
            migrations run on first boot. Without it a slow start looks like a
            hung process and the kubelet restarts the pod in a loop.

            The app answers /api/v2/live while the process runs and /api/v2/ready once
            the database answers and its schema is complete, both without a login. They
            sit under BASE_URL like everything else, so the paths are prefixed with it.
          */}}
          {{- if or (not (hasKey $startup "enabled")) $startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ printf "%s%s" $basePath ($startup.path | default $readiness.path | default "/api/v2/ready") }}
              port: http
              scheme: {{ $scheme }}
            initialDelaySeconds: {{ $startup.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $startup.periodSeconds | default 10 }}
            timeoutSeconds: {{ $startup.timeoutSeconds | default 5 }}
            failureThreshold: {{ $startup.failureThreshold | default 30 }}
          {{- end }}

          livenessProbe:
            httpGet:
              path: {{ printf "%s%s" $basePath ($liveness.path | default "/api/v2/live") }}
              port: http
              scheme: {{ $scheme }}
            initialDelaySeconds: {{ $liveness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ $liveness.periodSeconds | default 15 }}
            timeoutSeconds: {{ $liveness.timeoutSeconds | default 15 }}
            failureThreshold: {{ $liveness.failureThreshold | default 3 }}

          readinessProbe:
            httpGet:
              path: {{ printf "%s%s" $basePath ($readiness.path | default "/api/v2/ready") }}
              port: http
              scheme: {{ $scheme }}
            initialDelaySeconds: {{ $readiness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ $readiness.periodSeconds | default 15 }}
            timeoutSeconds: {{ $readiness.timeoutSeconds | default 15 }}
            failureThreshold: {{ $readiness.failureThreshold | default 3 }}

          volumeMounts:
            - mountPath: /app/dist/persistent
              name: server-persistent-storage
            - mountPath: /home/node/.ssh
              name: server-persistent-storage
            {{- if $seedOn }}
            - name: rte-seed
              mountPath: /etc/ansibleforms/seed
              readOnly: true
            {{- end }}
            {{- with .Values.forms }}
              {{- with .configMap }}
                {{- if .enabled }}
            - name: forms-config
              mountPath: {{ .mountPath }}
              subPath: {{ .key }}
                {{- end }}
              {{- end }}

              {{- with .extraFormsConfigMap }}
                {{- if .enabled }}
            - name: forms-extra-config
              mountPath: {{ .mountPath }}
                {{- end }}
              {{- end }}

              {{- with .customJs }}
                {{- if .enabled }}
            - name: forms-custom-js
              mountPath: {{ .mountPath }}
              subPath: {{ .key }}
                {{- end }}
              {{- end }}
            {{- end }}

            {{- if $server.extraVolumeMounts }}
{{ toYaml $server.extraVolumeMounts | nindent 12 }}
            {{- end }}

        {{- if $rteOn }}
        {{- /*
          The RTE runs the playbooks. Same pod as the app, so it sees the same volume
          (playbooks, repositories, uploads, the SSH key) and takes the job's files from it
          (RTE_FILES=local). The app dials it on 127.0.0.1 with RTE_TOKEN and keeps one
          WebSocket open (RTE_MODE=inbound): the job, its output and its events go through
          it, so the RTE gets no database settings and no ENCRYPTION_SECRET. /live and
          /ready need no token, /metrics needs METRICS_TOKEN.
        */}}
        - name: rte
          image: {{ $rte.image | required "containers.rte.image is required while containers.rte.enabled is true" }}
          imagePullPolicy: {{ $rte.imagePullPolicy | default "IfNotPresent" }}

          ports:
            - name: rte
              containerPort: {{ $rtePort }}
              protocol: TCP

          env:
            {{- range $key, $value := ((($app.rte | default dict).env) | default dict) }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}

            {{- /* After the user's env, so these cannot be overridden by accident there */}}
            - name: PORT
              value: {{ $rtePort | quote }}

            {{- /* Only the app pod talks to it, over 127.0.0.1: no certificate to manage */}}
            - name: HTTPS
              value: "0"

            {{- /*
              No RTE_URL and no APP_URL: an inbound RTE uses them only to register itself
              with the app, and the seed declares the runner instead. With RTE_URL on plain
              http it would also warn at every start that the token goes in clear, which
              over 127.0.0.1 inside the pod it never leaves.
            */}}
            - name: NODE_ENV
              value: "production"

            {{- /* The app dials it and keeps one socket open; its files are the app's own */}}
            - name: RTE_MODE
              value: "inbound"

            - name: RTE_FILES
              value: "local"

            - name: RTE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ansibleforms.rte.tokenSecretName" . }}
                  key: {{ include "ansibleforms.rte.tokenSecretKey" . }}

            {{- with $rte.extraEnv }}
{{ toYaml . | nindent 12 }}
            {{- end }}

          {{- with $rte.extraEnvFrom }}
          envFrom:
{{ toYaml . | nindent 12 }}
          {{- end }}

          resources:
            limits:
              cpu: {{ $rteLimits.cpu | default "2" }}
              memory: {{ $rteLimits.memory | default "2048Mi" }}
            requests:
              cpu: {{ $rteRequests.cpu | default "250m" }}
              memory: {{ $rteRequests.memory | default "256Mi" }}

          {{- /* The app's user: the files on the shared volume belong to it */}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: {{ $server.runAsUser | default 1000 }}
            runAsGroup: {{ $server.runAsGroup | default 1000 }}
            capabilities:
              drop:
                - ALL

          {{- /*
            /ready and /live need no token (the socket does). Inbound, ready means the RTE
            listens and is not stopping: it reads no database, so it is ready at once.
            Plain HTTP, since the chart sets HTTPS=0 on it above.
          */}}
          startupProbe:
            httpGet:
              path: /ready
              port: rte
              scheme: HTTP
            initialDelaySeconds: {{ $rteStartup.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $rteStartup.periodSeconds | default 5 }}
            timeoutSeconds: {{ $rteStartup.timeoutSeconds | default 5 }}
            failureThreshold: {{ $rteStartup.failureThreshold | default 60 }}

          livenessProbe:
            httpGet:
              path: /live
              port: rte
              scheme: HTTP
            periodSeconds: {{ $rteLiveness.periodSeconds | default 30 }}
            timeoutSeconds: {{ $rteLiveness.timeoutSeconds | default 5 }}
            failureThreshold: {{ $rteLiveness.failureThreshold | default 3 }}

          volumeMounts:
            - mountPath: /app/dist/persistent
              name: server-persistent-storage
            - mountPath: /home/node/.ssh
              name: server-persistent-storage
            {{- with $rte.extraVolumeMounts }}
{{ toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}

      restartPolicy: Always

      volumes:
        - name: server-persistent-storage
          persistentVolumeClaim:
            claimName: {{ include "ansibleforms.server.pvcName" . }}

        {{- if $seedOn }}
        - name: rte-seed
          configMap:
            name: {{ include "ansibleforms.rte.seedName" . }}
        {{- end }}

        {{- with .Values.forms }}
          {{- with .configMap }}
            {{- if .enabled }}
        - name: forms-config
          configMap:
            name: {{ .name }}
            {{- end }}
          {{- end }}

          {{- with .extraFormsConfigMap }}
            {{- if .enabled }}
        - name: forms-extra-config
          configMap:
            name: {{ .name }}
            {{- end }}
          {{- end }}

          {{- with .customJs }}
            {{- if .enabled }}
        - name: forms-custom-js
          configMap:
            name: {{ .name }}
            {{- end }}
          {{- end }}
        {{- end }}

        {{- if .Values.extraVolumes }}
{{ toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
{{- end }}
