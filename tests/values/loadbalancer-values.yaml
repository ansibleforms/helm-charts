---
# LoadBalancer services without an explicit address, which is the common case
# with MetalLB or a cloud controller handing out the IP.
applications:
  mysql:
    password: ci-not-a-real-password
    user: root
  server:
    env:
      HTTPS: 0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-not-a-real-password
      ENCRYPTION_SECRET: ci-not-a-real-secret
      # the session key and the RTE token: lint and template have no cluster to read
      # them back from, and the chart refuses to generate them there
      ACCESS_TOKEN_SECRET: ci-not-a-real-session-key
  rte:
    token: ci-not-a-real-rte-token

ingress:
  enabled: false

services:
  mysql:
    type: ClusterIP
  server:
    type: LoadBalancer
