---
# The NetworkPolicy on, with an extra peer and a policy for the server too, so
# the render covers every branch of that template.
networkPolicy:
  enabled: true
  mysqlExtraFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: backups
  server:
    enabled: true
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx

applications:
  mysql:
    password: ci-not-a-real-password
    user: root
  server:
    env:
      HTTPS: 0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-not-a-real-password
      ENCRYPTION_SECRET: ci-not-a-real-secret
      # the session key and the RTE token: lint and template have no cluster to read
      # them back from, and the chart refuses to generate them there
      ACCESS_TOKEN_SECRET: ci-not-a-real-session-key
  rte:
    token: ci-not-a-real-rte-token

ingress:
  enabled: false

storages:
  mysql: {size: 1Gi, accessMode: ReadWriteOnce}
  server: {size: 1Gi, accessMode: ReadWriteOnce}
