---
# config.yaml, the form files and custom javascript supplied as external ConfigMaps.
# Render only, since the referenced ConfigMaps are managed outside the chart.
applications:
  mysql:
    password: ci-not-a-real-password
    user: root
  server:
    env:
      HTTPS: 0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-not-a-real-password
      ENCRYPTION_SECRET: ci-not-a-real-secret
      # the session key and the RTE token: lint and template have no cluster to read
      # them back from, and the chart refuses to generate them there
      ACCESS_TOKEN_SECRET: ci-not-a-real-session-key
  rte:
    token: ci-not-a-real-rte-token

ingress:
  enabled: true
  hostname: ansibleforms.ci.example.com

forms:
  configMap:
    enabled: true
    key: config.yaml
    mountPath: /app/dist/persistent/config.yaml
    name: ansibleforms-config
  customJs:
    enabled: true
    key: custom.js
    mountPath: /app/dist/src/functions/custom.js
    name: ansibleforms-custom-js
  extraFormsConfigMap:
    enabled: true
    mountPath: /app/dist/persistent/forms
    name: ansibleforms-extra-forms
