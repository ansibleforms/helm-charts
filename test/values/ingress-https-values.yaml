---
# The same thing with the application terminating TLS itself, so it listens on
# 443 and the Service moves with it. This is the shape that used to render an
# Ingress pointing at port 80 against a Service that only published 443, which
# an ingress controller answers with a 503.
applications:
  mysql:
    password: ci-not-a-real-password
    user: root
  server:
    env:
      HTTPS: 1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-not-a-real-password
      ENCRYPTION_SECRET: ci-not-a-real-secret
      # the session key and the RTE token: lint and template have no cluster to read
      # them back from, and the chart refuses to generate them there
      ACCESS_TOKEN_SECRET: ci-not-a-real-session-key
  rte:
    token: ci-not-a-real-rte-token

containers:
  mysql:
    resources:
      limits: {cpu: '1', memory: 1024Mi}
      requests: {cpu: 100m, memory: 256Mi}
  server:
    resources:
      limits: {cpu: '1', memory: 1024Mi}
      requests: {cpu: 100m, memory: 256Mi}

ingress:
  enabled: true
  className: traefik
  hostname: ansibleforms.ci.example.com
  tls:
    enabled: false
  # null drops the chart's default annotations, which are ingress-nginx ones
  # that Traefik would ignore anyway.
  annotations: null

# The controller has to be told to speak TLS to the backend as well. Traefik
# reads that from the Service, not from the Ingress, and the self-signed
# certificate needs a ServersTransport that skips verification. The CI job
# creates one named insecure in the ing-https namespace, which the provider
# names <namespace>-<name>@kubernetescrd.
services:
  server:
    annotations:
      traefik.ingress.kubernetes.io/service.serversscheme: https
      traefik.ingress.kubernetes.io/service.serverstransport: ing-https-insecure@kubernetescrd

storages:
  mysql: {size: 1Gi, accessMode: ReadWriteOnce}
  server: {size: 1Gi, accessMode: ReadWriteOnce}
