---
# Credentials supplied through a Secret managed outside the chart, the way
# External Secrets or Sealed Secrets would. No password appears here, and the
# chart must not generate a Secret of its own.
secrets:
  existingSecret: ansibleforms-credentials

applications:
  mysql:
    user: root
  server:
    env:
      HTTPS: 0
      # the session key and the RTE token: lint and template have no cluster to read
      # them back from, and the chart refuses to generate them there
      ACCESS_TOKEN_SECRET: ci-not-a-real-session-key
  rte:
    token: ci-not-a-real-rte-token

ingress:
  enabled: false

storages:
  mysql:
    size: 1Gi
    accessMode: ReadWriteOnce
  server:
    size: 1Gi
    accessMode: ReadWriteOnce
