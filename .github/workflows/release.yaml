name: Release chart

# Publishing is driven by the version field in Chart.yaml, which is the AnsibleForms
# version the chart ships: the Follow app release pull request moves it. Once that is
# merged to main, this workflow tags the release, attaches the
# packaged chart, pushes it to GHCR as an OCI artifact and asks ansibleforms.com
# to rebuild. The website serves the Helm repository at /helm-charts/, indexed
# from the releases here; this repository has no Pages site of its own.
#
# It waits for CI rather than running beside it. Triggered on push, the two
# raced: the first release went out while the tests were still going, so a red
# build would have published anyway. workflow_run only fires once CI has
# finished, and the job below refuses to do anything unless it finished green.
#
# There is no paths filter any more either. It was the wrong tool: a template
# fix with no version bump published nothing, and touching Chart.yaml without
# changing the version started a release for no reason. The "does this tag
# already exist" check below decides that properly.
on:
  # workflow_run always runs this file from main, whichever branch CI ran on, so
  # a maintenance line (release/<major>.x), should one be cut, is released by this same copy.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-chart
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    # Green CI, and only from a push to main. A pull request whose branch also
    # happens to be called main would otherwise reach this.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: write
      packages: write
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      # workflow_run always runs the workflow file from the default branch and
      # checks out its tip by default, which is not necessarily the commit that
      # was tested. Package what CI actually looked at.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Read chart version
        id: chart
        run: |
          version="$(helm show chart charts/ansibleforms | awk '/^version:/ {print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chart version is $version"

      - name: Skip if the tag already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.check.outputs.released == 'true'
        run: helm package charts/ansibleforms --destination dist

      - name: Create GitHub release
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.chart.outputs.version }}
          # The commit CI tested and this job packaged. Without --target the tag went on
          # the tip of the default branch, so a 6.x release tagged a commit on main.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Only the highest version is GitHub's "Latest". A 6.x patch released after
          # 7.0.0 must not take that from the 7 line.
          highest="$( { gh release list --limit 200 --json tagName --jq '.[].tagName' | sed 's/^v//'; echo "$VERSION"; } | sort -V | tail -1)"
          latest=false
          [ "$highest" = "$VERSION" ] && latest=true
          echo "Releasing $VERSION (highest released: $highest, latest: $latest)"
          # The title is the tag, as in every AnsibleForms repository
          gh release create "v${VERSION}" \
            --target "$SHA" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest="$latest" \
            "dist/ansibleforms-${VERSION}.tgz"

      # The automatic GITHUB_TOKEN is enough to push to GHCR as long as the job
      # asks for packages: write, so no personal access token is needed here.
      # A package pushed this way is linked to the repository and inherits its
      # visibility, so on a public repository it is publicly pullable straight
      # away with no visit to the package settings.
      - name: Push to GHCR
        if: steps.check.outputs.released == 'true'
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          helm registry login ghcr.io \
            --username '${{ github.actor }}' \
            --password '${{ github.token }}'
          helm push "dist/ansibleforms-${VERSION}.tgz" "oci://ghcr.io/${owner}/charts"

  # ansibleforms.com/helm-charts/ is the chart repository. The website assembles it from
  # the releases here at build time, so a release tells it to rebuild. GITHUB_TOKEN cannot
  # start a workflow in another repository, so the token comes from the ansibleforms-release
  # GitHub App, asked for the website repository only. Should the App or its key be
  # missing, this job only says so; the website's nightly build picks the release up within
  # a day either way. Run this workflow by hand to rebuild the site without a release.
  website:
    name: Rebuild ansibleforms.com
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Is the release App configured?
        id: app_configured
        env:
          KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ] && [ -n "${{ vars.RELEASE_APP_CLIENT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_APP_CLIENT_ID or RELEASE_APP_PRIVATE_KEY is not set - ansibleforms.com picks this release up on its nightly build"
          fi

      - uses: actions/create-github-app-token@v3
        id: app
        if: steps.app_configured.outputs.enabled == 'true'
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: website

      - name: Send chart-release to ansibleforms/website
        if: steps.app_configured.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api repos/ansibleforms/website/dispatches -f event_type=chart-release
          echo "ansibleforms.com rebuilds with the new chart"
