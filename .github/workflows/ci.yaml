name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_DOCS_VERSION: "1.14.2"

# The chart lives in charts/ansibleforms. Every run step starts there, so ".", ci/,
# Chart.yaml, values.yaml and files/ all mean the chart, exactly as they did when it sat
# at the root. The fixtures the repository keeps beside it are under ../../test/. The two
# steps that look at the whole repository (yamllint and ct) say so with their own
# working-directory.
defaults:
  run:
    working-directory: charts/ansibleforms

jobs:
  lint:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      # Full history: the version check below reads Chart.yaml from the base
      # branch to see whether the version moved.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: yamllint
        working-directory: .
        run: |
          pip install --quiet yamllint
          yamllint --strict .

      # VALUES.md is generated from the "# --" comments in values.yaml. A pull request
      # that changes a value or its comment without regenerating it would merge a
      # reference that no longer matches the chart, so CI regenerates it and fails
      # on any difference.
      - name: VALUES.md matches values.yaml
        working-directory: .
        run: |
          set -euo pipefail
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/r" -w /r \
            "jnorwood/helm-docs:v${HELM_DOCS_VERSION}" \
            --chart-search-root charts --template-files VALUES.md.gotmpl \
            --output-file VALUES.md --ignore-non-descriptions
          git diff --exit-code -- charts/*/VALUES.md || {
            echo "::error::VALUES.md is out of date. Run the helm-docs command at the top of it and commit the result."
            exit 1; }

      # The chart is versioned with AnsibleForms: version is always the appVersion it
      # ships, and a release is the Follow app release pull request moving both. A chart
      # change made between two app releases goes out with the next one, so it has to be
      # listed under "## Unreleased" in the changelog, or nobody finds out it is waiting.
      - name: A chart change is released with the next AnsibleForms version
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2}' Chart.yaml)"
          app="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' Chart.yaml)"
          if [ "$version" != "$app" ]; then
            echo "::error::Chart.yaml says version $version and appVersion $app. The chart is versioned with AnsibleForms: the two are always the same."
            exit 1
          fi
          changed="$(git diff --name-only "$BASE" HEAD -- Chart.yaml values.yaml templates files)"
          if [ -z "$changed" ]; then
            echo "Nothing under Chart.yaml, values.yaml, templates/ or files/ changed here."
            exit 0
          fi
          echo "Chart files this pull request touches:"
          echo "$changed" | sed 's/^/  /'
          # empty on the first chart, whose base has no Chart.yaml yet
          before="$( (git show "$BASE:./Chart.yaml" 2>/dev/null || true) | awk '/^version:/ {print $2}')"
          if [ "$before" != "$version" ]; then
            if gh release view "v${version}" >/dev/null 2>&1; then
              echo "::error::v${version} is already released, so the release job would skip this one."
              exit 1
            fi
            echo "The chart moves to AnsibleForms $version, which is unreleased."
            exit 0
          fi
          if ! grep -q '^## Unreleased$' CHANGELOG.md || [ -z "$(git diff "$BASE" HEAD -- CHANGELOG.md)" ]; then
            echo "::error::The chart changed between two AnsibleForms releases. Say what changed under '## Unreleased' at the top of CHANGELOG.md: it is released with the next AnsibleForms version."
            exit 1
          fi
          echo "The change is listed under Unreleased and goes out with the next AnsibleForms version."

      # Rendering with nothing but the defaults has to FAIL: values.yaml ships
      # placeholder credentials, and writing <ENTER_PASSWORD_HERE> into a real
      # Secret is never what anyone meant. This asserts the guard is still there.
      - name: Refuse to render the placeholder credentials
        run: |
          if helm template guard-check . >/dev/null 2>&1; then
            echo "::error::The chart rendered with the placeholder credentials still in place."
            exit 1
          fi
          helm template guard-check . 2>&1 | grep -q "secrets.existingSecret" || {
            echo "::error::It failed, but not with the message that tells people how to fix it."
            helm template guard-check . 2>&1 | tail -5
            exit 1
          }
          echo "Placeholder credentials are refused, with a message pointing at the fix."

      # Two ways of configuring the security contexts that cannot work, and that
      # fail at runtime in ways nobody would connect back to a values file: one
      # leaves the pod in Init:CreateContainerConfigError while helm reports the
      # release as deployed, the other CrashLoops MySQL with "setgid: Operation
      # not permitted". The chart refuses both at render time instead. Assert it
      # still does, and that the message names the value to change.
      - name: Combinations the chart must refuse
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, subprocess, sys, yaml

          failures = []
          for path in sorted(glob.glob("../../test/values/refused/*-values.yaml")):
              out = subprocess.run(["helm", "template", "refused", ".", "--values", path],
                                   capture_output=True, text=True)
              if out.returncode == 0:
                  failures.append(f"{path} rendered. It is supposed to be refused.")
                  continue

              message = out.stderr + out.stdout
              # Refusing is half the job. A message that does not name a value
              # the file actually sets leaves the reader nowhere, so require
              # one of its top level keys to appear in the text.
              keys = [k for k in (yaml.safe_load(open(path)) or {})]
              if not any(k in message for k in keys):
                  failures.append(f"{path} is refused, but the message names none of {keys}")
                  continue

              first = next((l for l in message.splitlines() if l.strip()
                            and not l.startswith("Error:")), "")
              print(f"{path}\n  {first.strip()}")

          if failures:
              print("\n".join(failures))
              sys.exit("::error::The chart is not refusing what it should, or not explaining why.")
          PY

      # appVersion and the default image are two places saying the same thing,
      # and nothing kept them together. Bump one and forget the other and the
      # chart reports a version it does not deploy, which is the sort of thing
      # nobody notices until they are debugging something else entirely.
      - name: appVersion and the default image must agree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml

          chart = yaml.safe_load(open("Chart.yaml"))
          values = yaml.safe_load(open("values.yaml"))
          app = str(chart["appVersion"])
          image = values["containers"]["server"]["image"]
          rte = values["containers"]["rte"]["image"]
          mysql = values["containers"]["mysql"]["image"]
          test_image = values["tests"]["image"]

          failures = []
          if ":" not in image:
              failures.append(f"containers.server.image {image!r} has no tag at all")
          elif image.rsplit(":", 1)[1] != app:
              failures.append(f"appVersion is {app} but containers.server.image is {image}")

          # The RTE is released with the app and tagged alike; the two move together.
          if ":" not in rte or rte.rsplit(":", 1)[1] != app:
              failures.append(f"appVersion is {app} but containers.rte.image is {rte}")

          # The comment in values.yaml says this one is pinned deliberately,
          # because MySQL does not support downgrades and a floating tag turns a
          # reschedule into an unattended major upgrade with no way back.
          if ":" not in mysql or mysql.rsplit(":", 1)[1] in ("latest", ""):
              failures.append(f"containers.mysql.image {mysql!r} is not pinned to a version")

          # Artifact Hub lists the images from this annotation, so it has to name
          # exactly what values.yaml deploys, and nothing else.
          listed = sorted(i["image"] for i in yaml.safe_load(
              chart.get("annotations", {}).get("artifacthub.io/images", "[]")) or [])
          deployed = sorted([image, rte, mysql, test_image])
          if listed != deployed:
              failures.append(f"artifacthub.io/images lists {listed} but values.yaml deploys {deployed}")

          if failures:
              print("\n".join(failures))
              sys.exit("::error::The chart's own image references disagree with themselves.")
          print(f"appVersion {app} matches {image} and {rte}, and {mysql} is pinned.")
          PY

      - name: helm lint
        run: |
          for f in ci/*-values.yaml ../../test/values/*-values.yaml; do
            echo "::group::helm lint with $f"
            helm lint . --strict --values "$f"
            echo "::endgroup::"
          done

      # The Service moves to 443 when applications.server.env.HTTPS is 1, and the
      # Ingress backend used to say 80 regardless, so with HTTPS on the Ingress
      # pointed at a port the Service did not expose and every request came back
      # 503. They are tied together by port name now.
      #
      # This resolves the backend the way an ingress controller does, following
      # the Service name and then the port, so it stays honest whether the
      # backend is written as a name or as a number.
      # PyYAML is already here, it comes in with yamllint above.
      - name: The Ingress backend must resolve to a port the Service publishes
        run: |
          set -euo pipefail
          for f in ci/default-values.yaml ../../test/values/https-values.yaml; do
            echo "::group::ingress backend with $f"
            helm template portcheck . --values "$f" > /tmp/portcheck.yaml
            python3 - <<'PY'
          import sys, yaml

          docs = [d for d in yaml.safe_load_all(open("/tmp/portcheck.yaml")) if d]
          ingresses = [d for d in docs if d["kind"] == "Ingress"]
          if not ingresses:
              sys.exit("::error::No Ingress was rendered, so this proves nothing.")

          services = {d["metadata"]["name"]: d for d in docs if d["kind"] == "Service"}

          for ing in ingresses:
              for rule in ing["spec"]["rules"]:
                  for path in rule["http"]["paths"]:
                      backend = path["backend"]["service"]
                      name, port = backend["name"], backend["port"]
                      svc = services.get(name)
                      if svc is None:
                          sys.exit(f"::error::Ingress points at Service {name!r}, "
                                   f"which the chart does not render. "
                                   f"It renders {sorted(services)}.")
                      published = svc["spec"]["ports"]
                      by_name = {p["name"]: p["port"] for p in published if p.get("name")}
                      by_number = {p["port"] for p in published}
                      if "name" in port:
                          ok = port["name"] in by_name
                      else:
                          ok = port["number"] in by_number
                      print(f"{name} backend {port} against published {published}: "
                            f"{'ok' if ok else 'BROKEN'}")
                      if not ok:
                          sys.exit(f"::error::Ingress asks {name} for {port}, but that "
                                   f"Service publishes {sorted(by_number)} "
                                   f"(named {sorted(by_name)}).")
          print("Every Ingress backend resolves to a port its Service publishes.")
          PY
            echo "::endgroup::"
          done

      # Scheduling is pass-through: whatever goes into the values file has to
      # come out in the pod spec, unchanged and in the right place. kubeconform
      # already rejects a block indented into the wrong parent, since the stray
      # keys show up as additionalProperties, but it cannot notice a field that
      # was quietly dropped because the template never referenced it. This
      # compares the two sides directly.
      - name: Scheduling values must reach both pod specs
        run: |
          set -euo pipefail
          helm template sched . --values ../../test/values/scheduling-values.yaml > /tmp/sched.yaml
          python3 - <<'PY'
          import sys, yaml

          values = yaml.safe_load(open("../../test/values/scheduling-values.yaml"))
          docs = [d for d in yaml.safe_load_all(open("/tmp/sched.yaml")) if d]
          pods = {d["metadata"]["name"]: d["spec"]["template"]
                  for d in docs if d["kind"] == "Deployment"}

          FIELDS = ["nodeSelector", "tolerations", "affinity",
                    "topologySpreadConstraints", "priorityClassName",
                    "serviceAccountName"]
          failures = []

          for comp, name in (("server", "sched-server"), ("mysql", "sched-mysql")):
              cfg = values["containers"][comp]
              spec = pods[name]["spec"]

              for field in FIELDS:
                  want = cfg.get(field)
                  if not want:
                      continue
                  got = spec.get(field)
                  if got != want:
                      failures.append(f"{name}: {field} is {got!r}, values asked for {want!r}")

              # imagePullSecrets falls back to the release wide list
              want = cfg.get("imagePullSecrets") or values.get("imagePullSecrets")
              if want and spec.get("imagePullSecrets") != want:
                  failures.append(f"{name}: imagePullSecrets is "
                                  f"{spec.get('imagePullSecrets')!r}, expected {want!r}")

              # podLabels and commonLabels both land on the pod, never on the selector
              labels = pods[name]["metadata"]["labels"]
              for k, v in (cfg.get("podLabels") or {}).items():
                  if labels.get(k) != v:
                      failures.append(f"{name}: podLabel {k}={v} missing from the pod")
              for k, v in (values.get("commonLabels") or {}).items():
                  if labels.get(k) != str(v):
                      failures.append(f"{name}: commonLabel {k}={v} missing from the pod")

              ann = pods[name]["metadata"].get("annotations") or {}
              for k, v in (values.get("commonAnnotations") or {}).items():
                  if ann.get(k) != v:
                      failures.append(f"{name}: commonAnnotation {k} missing from the pod")

          # A Deployment selector is immutable. A commonLabel landing there would
          # make the chart impossible to upgrade, so this one is not negotiable.
          for d in docs:
              if d["kind"] != "Deployment":
                  continue
              sel = d["spec"]["selector"]["matchLabels"]
              for k in list(values.get("commonLabels") or {}) + ["role"]:
                  if k in sel:
                      failures.append(f"{d['metadata']['name']}: {k!r} reached the "
                                      f"selector, which is immutable")

          # commonLabels and commonAnnotations reach every object, not just the pods
          for d in docs:
              where = f"{d['kind']}/{d['metadata']['name']}"
              labels = d["metadata"].get("labels") or {}
              ann = d["metadata"].get("annotations") or {}
              for k, v in (values.get("commonLabels") or {}).items():
                  if labels.get(k) != str(v):
                      failures.append(f"{where}: commonLabel {k} missing")
              for k in (values.get("commonAnnotations") or {}):
                  if k not in ann:
                      failures.append(f"{where}: commonAnnotation {k} missing")

          if failures:
              print("\n".join(failures))
              sys.exit("::error::Scheduling or common metadata did not survive rendering.")
          print(f"Checked {len(FIELDS) + 1} fields on both pods and common metadata "
                f"on all {len(docs)} objects.")
          PY

      # MySQL had no probes at all, so the Service advertised an endpoint the
      # moment the container started, long before the server accepted a
      # connection. The three probes below all run mysqladmin ping, which needs
      # no credentials: it answers "access denied" well before it would answer a
      # query, and that is the signal wanted. Assert both halves of that, since
      # the obvious way to write this probe puts the root password on a command
      # line where every ps in the container can read it.
      - name: MySQL probes exist and carry no credentials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, sys, yaml

          failures = []
          for values in sorted(glob.glob("ci/*-values.yaml") + glob.glob("../../test/values/*-values.yaml")):
              out = subprocess.run(
                  ["helm", "template", "probecheck", ".", "--values", values],
                  capture_output=True, text=True, check=True).stdout
              docs = [d for d in yaml.safe_load_all(out) if d]
              mysql = [d for d in docs
                       if d["kind"] == "Deployment"
                       and d["metadata"]["name"] == "probecheck-mysql"]
              if not mysql:
                  print(f"{values}: no bundled MySQL, skipped")
                  continue

              container = mysql[0]["spec"]["template"]["spec"]["containers"][0]
              cfg = (yaml.safe_load(open(values)) or {}).get("containers", {}).get("mysql") or {}

              for probe in ("startupProbe", "readinessProbe", "livenessProbe"):
                  key = probe.replace("Probe", "")
                  wanted = (cfg.get(key) or {}).get("enabled", True)
                  present = probe in container
                  if wanted and not present:
                      failures.append(f"{values}: {probe} is missing")
                  if not wanted and present:
                      failures.append(f"{values}: {probe} is set but values disabled it")
                  if not present:
                      continue
                  command = " ".join(container[probe]["exec"]["command"])
                  # -pSECRET or --password=..., and any expansion of the two env
                  # vars holding the root password. The negative lookbehind is
                  # what keeps --protocol=TCP from matching -p.
                  if re.search(r"(?<!-)-p\S|--password|\$\{?(MYSQL_ROOT_PASSWORD|DB_PASSWORD)",
                               command):
                      failures.append(f"{values}: {probe} command looks like it "
                                      f"passes a credential: {command!r}")
              print(f"{values}: probes ok")

          if failures:
              print("\n".join(failures))
              sys.exit("::error::MySQL probes are wrong.")
          PY

      # The checksums have to react to the right thing and to nothing else. Too
      # sensitive and every upgrade churns the pods for no reason; not sensitive
      # enough and a configuration change never reaches the container, which is
      # the bug they exist to fix.
      - name: Checksums track configuration, and only configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, sys, yaml

          def sums(*extra):
              out = subprocess.run(
                  ["helm", "template", "sums", ".", "--values", "ci/default-values.yaml", *extra],
                  capture_output=True, text=True, check=True).stdout
              got = {}
              for d in yaml.safe_load_all(out):
                  if not d or d["kind"] != "Deployment":
                      continue
                  ann = d["spec"]["template"]["metadata"].get("annotations") or {}
                  name = d["metadata"]["name"].rsplit("-", 1)[-1]
                  for k, v in ann.items():
                      if k.startswith("checksum/"):
                          got[f"{name} {k}"] = v
              return got

          base = sums()
          failures = []

          if not base:
              failures.append("no checksums at all, rollOnChange is on by default")
          if base != sums():
              failures.append("two identical renders disagree, so every upgrade would churn")

          pw = sums("--set", "applications.server.env.ADMIN_PASSWORD=something-else")
          for key in ("server checksum/secret", "mysql checksum/secret"):
              if base.get(key) == pw.get(key):
                  failures.append(f"{key} did not move when the password changed")
          if base.get("mysql checksum/my-cnf") != pw.get("mysql checksum/my-cnf"):
              failures.append("the my.cnf checksum moved when only the password changed")

          cnf = sums("--set", "mysql.config=[mysqld]\ninnodb_buffer_pool_size = 256M\n")
          if base.get("mysql checksum/my-cnf") == cnf.get("mysql checksum/my-cnf"):
              failures.append("the my.cnf checksum did not move when my.cnf changed")
          if base.get("server checksum/secret") != cnf.get("server checksum/secret"):
              failures.append("the secret checksum moved when only my.cnf changed")

          for setting in ("applications.rte.token=a-token-of-sixteen-chars",
                          "applications.server.env.ACCESS_TOKEN_SECRET=another-session-key"):
              key = sums("--set", setting)
              if base.get("server checksum/keys") == key.get("server checksum/keys"):
                  failures.append(f"the keys checksum did not move for {setting}")
              if base.get("server checksum/secret") != key.get("server checksum/secret"):
                  failures.append(f"the secret checksum moved for {setting}")

          if sums("--set", "rollOnChange.enabled=false"):
              failures.append("rollOnChange.enabled=false still wrote checksums")

          if failures:
              print("\n".join(failures))
              sys.exit("::error::The rollout checksums are not tracking what they should.")
          print(f"Checked {len(base)} checksums: stable when nothing changes, "
                f"and each one moves only for its own input.")
          PY

      # The Kubernetes, kubeconform and Calico versions live in test/versions/Dockerfile,
      # where Dependabot can bump them. kind and kubectl come with helm/kind-action, pinned
      # to an exact release (the floating v1 tag lagged a kind release behind) so that
      # Dependabot moves it.
      - name: Read the pinned versions
        id: versions
        working-directory: .
        run: |
          set -euo pipefail
          from() { awk -v stage="$1" '$1 == "FROM" && $NF == stage {print $2}' test/versions/Dockerfile; }
          node="$(from kind-node)"
          kube="${node#*:v}"
          calico="$(from calico)"
          {
            echo "kind_node=$node"
            echo "kubernetes=${kube%@*}"
            echo "kubeconform=$(from kubeconform)"
            echo "calico=${calico##*:}"
            echo "chart_testing=$(from chart-testing)"
          } >> "$GITHUB_OUTPUT"
          echo "kind node $node, kubeconform $(from kubeconform), calico ${calico##*:}"

      # Rendering against the pinned Kubernetes version catches removed or renamed API
      # versions before a cluster meets them. The rendered output is linted too: Helm
      # templates cannot be parsed as YAML directly, so a duplicated key only shows up
      # once the templates have been expanded.
      - name: helm template and kubeconform
        env:
          KUBERNETES: ${{ steps.versions.outputs.kubernetes }}
          KUBECONFORM: ${{ steps.versions.outputs.kubeconform }}
        run: |
          mkdir -p rendered
          for f in ci/*-values.yaml ../../test/values/*-values.yaml; do
            name="$(basename "$f" -values.yaml)"
            for kube in "$KUBERNETES"; do
              echo "::group::$name on Kubernetes $kube"
              helm template ansibleforms . \
                --values "$f" \
                --kube-version "$kube" \
                > "rendered/${name}-${kube}.yaml"
              # Only the structural rules matter here. Whitespace and layout are
              # whatever the templates produced, and ConfigMap payloads legitimately
              # carry trailing spaces. What this catches is duplicate keys, which is
              # how a merge once turned one PVC template into two half-merged copies.
              yamllint --strict -d '{extends: default, rules: {key-duplicates: enable, line-length: disable, empty-lines: disable, indentation: disable, comments: disable, comments-indentation: disable, document-start: disable, truthy: disable, braces: disable, trailing-spaces: disable, new-line-at-end-of-file: disable, empty-values: disable}}' \
                "rendered/${name}-${kube}.yaml"
              docker run --rm -v "$PWD/rendered:/rendered:ro" "$KUBECONFORM" \
                -strict \
                -summary \
                -kubernetes-version "$kube" \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                "/rendered/${name}-${kube}.yaml"
              echo "::endgroup::"
            done
          done

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-manifests
          # Actions resolve paths from the repository root, unlike the run steps, which
          # start in charts/ansibleforms, where the manifests are rendered.
          path: charts/ansibleforms/rendered/
          retention-days: 7

  # Rendering has always covered several Kubernetes versions; installing
  # covered exactly one. The two catch different things: kubeconform reads a
  # schema, while an install is where a probe, a security context or a storage
  # default meets an actual kubelet.
  install:
    name: Install on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2


      # The Kubernetes, kubeconform and Calico versions live in test/versions/Dockerfile,
      # where Dependabot can bump them. kind and kubectl come with helm/kind-action, pinned
      # to an exact release (the floating v1 tag lagged a kind release behind) so that
      # Dependabot moves it.
      - name: Read the pinned versions
        id: versions
        working-directory: .
        run: |
          set -euo pipefail
          from() { awk -v stage="$1" '$1 == "FROM" && $NF == stage {print $2}' test/versions/Dockerfile; }
          node="$(from kind-node)"
          kube="${node#*:v}"
          calico="$(from calico)"
          {
            echo "kind_node=$node"
            echo "kubernetes=${kube%@*}"
            echo "kubeconform=$(from kubeconform)"
            echo "calico=${calico##*:}"
            echo "chart_testing=$(from chart-testing)"
          } >> "$GITHUB_OUTPUT"
          echo "kind node $node, kubeconform $(from kubeconform), calico ${calico##*:}"

      - uses: helm/kind-action@v1.15.0
        with:
          node_image: ${{ steps.versions.outputs.kind_node }}

      # ct installs the chart once per ci/*-values.yaml file and waits for every
      # pod to become ready, so a broken probe or a bad default fails here.
      - name: ct install
        working-directory: .
        # ct runs from its own image rather than helm/chart-testing-action, whose uv setup
        # warned on every run. The container reaches the kind cluster through the host
        # network and the kubeconfig kind wrote.
        env:
          CHART_TESTING: ${{ steps.versions.outputs.chart_testing }}
        run: |
          docker run --rm --network host \
            -v "$HOME/.kube:/root/.kube:ro" -v "$PWD:/workdir" -w /workdir "$CHART_TESTING" \
            sh -c 'git config --global --add safe.directory /workdir && ct install --config ct.yaml --charts charts/ansibleforms'

      # ct can only install what a values file alone describes, and these two
      # need something in the cluster first, so they are driven by hand. They
      # are worth the extra minutes: between them they cover the two ways a
      # deployment stops being self-contained.
      - name: Install against a Secret managed outside the chart
        run: |
          kubectl create namespace existing-secret
          kubectl -n existing-secret create secret generic ansibleforms-credentials \
            --from-literal=DB_USER=root \
            --from-literal=DB_PASSWORD=ci-not-a-real-password \
            --from-literal=ENCRYPTION_SECRET=ci-not-a-real-secret \
            --from-literal=ADMIN_USERNAME=admin \
            --from-literal=ADMIN_PASSWORD=ci-not-a-real-password
          helm install existing-secret . \
            --namespace existing-secret \
            --values ../../test/values/existing-secret-values.yaml \
            --wait --timeout 12m
          # The chart must not have created one of its own alongside it.
          if kubectl -n existing-secret get secret existing-secret-secrets >/dev/null 2>&1; then
            echo "::error::The chart generated a Secret even though existingSecret was set."
            exit 1
          fi
          kubectl -n existing-secret get pods
          helm uninstall existing-secret --namespace existing-secret

      - name: Install against a database the chart does not manage
        run: |
          kubectl create namespace external-db
          kubectl -n external-db create secret generic mysql-root \
            --from-literal=password=ci-not-a-real-password
          kubectl -n external-db apply -f ../../test/manifests/external-mysql.yaml
          kubectl -n external-db rollout status deployment/external-mysql --timeout=8m
          # Belt and braces on top of the probe: wait until the server really
          # answers over TCP before touching it.
          for i in $(seq 1 60); do
            if kubectl -n external-db exec deployment/external-mysql -- \
                 sh -c 'mysqladmin ping -h 127.0.0.1 --protocol=TCP -uroot -p"$MYSQL_ROOT_PASSWORD" --silent' >/dev/null 2>&1; then
              echo "MySQL is accepting connections."
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::The external MySQL never came up."
              kubectl -n external-db logs deployment/external-mysql --tail=50
              exit 1
            fi
            sleep 5
          done
          # Nothing goes into the database first: AnsibleForms 7 creates its schema
          # when it finds the database empty, which is what the README promises an
          # operator with their own server.
          helm install external-db . \
            --namespace external-db \
            --values ../../test/values/external-db-values.yaml \
            --set applications.mysql.host=external-mysql.external-db.svc.cluster.local \
            --set applications.mysql.user=root \
            --wait --timeout 12m
          # Nothing MySQL-shaped should have come from the chart.
          for kind in deployment/external-db-mysql service/external-db-mysql pvc/external-db-mysql-pvc; do
            if kubectl -n external-db get "$kind" >/dev/null 2>&1; then
              echo "::error::The chart created $kind with mysql.enabled set to false."
              exit 1
            fi
          done
          kubectl -n external-db get pods
          # Ready is not enough here: the home page is static, so the pod comes
          # up and answers even when every query underneath is failing. Look at
          # what the application actually said instead.
          if ! kubectl -n external-db logs deployment/external-db-server -c server | grep -q "creating the schema"; then
            echo "::error::AnsibleForms did not create its schema on the empty external database."
            kubectl -n external-db logs deployment/external-db-server -c server --tail=60
            exit 1
          fi
          if kubectl -n external-db logs deployment/external-db-server -c server | grep -q "doesn't exist"; then
            echo "::error::The server is up but its tables are missing."
            kubectl -n external-db logs deployment/external-db-server -c server | grep "doesn't exist" | head -5
            exit 1
          fi
          helm uninstall external-db --namespace external-db

      # Every Deployment, Service and ConfigMap used to be named with a plain
      # literal, so a second release in the same namespace overwrote the first
      # and each Service selected the other one's pods. Install two and check
      # they stay apart.
      - name: Two releases side by side in one namespace
        run: |
          kubectl create namespace side-by-side
          for rel in blue green; do
            helm install "$rel" . \
              --namespace side-by-side \
              --values ci/no-ingress-values.yaml \
              --wait --timeout 12m
          done
          kubectl -n side-by-side get all
          for rel in blue green; do
            for kind in deployment/${rel}-server deployment/${rel}-mysql \
                        service/${rel}-server service/${rel}-mysql \
                        secret/${rel}-secrets pvc/${rel}-server-pvc pvc/${rel}-mysql-pvc; do
              kubectl -n side-by-side get "$kind" >/dev/null || {
                echo "::error::$kind is missing, the two releases collided."
                exit 1
              }
            done
            # The Service must resolve to its own release's pod and nobody else's.
            # EndpointSlice rather than Endpoints, which is deprecated from 1.33.
            eps="$(kubectl -n side-by-side get endpointslices \
                     -l "kubernetes.io/service-name=${rel}-server" \
                     -o jsonpath='{.items[*].endpoints[*].targetRef.name}')"
            echo "${rel}-server endpoints: $eps"
            count="$(printf '%s' "$eps" | wc -w)"
            if [ "$count" != "1" ]; then
              echo "::error::${rel}-server selects $count pods, expected exactly 1."
              exit 1
            fi
            case "$eps" in
              ${rel}-server-*) ;;
              *) echo "::error::${rel}-server selects $eps, which belongs to the other release."; exit 1 ;;
            esac
          done
          echo "The two releases are fully independent."
          helm uninstall blue green --namespace side-by-side

      # AnsibleForms 7 runs no playbook itself: the RTE in the server pod does. A pod that
      # comes up ready proves nothing about that, so launch a playbook form through the API
      # and wait for the RTE's output to come back.
      - name: A playbook runs on the RTE
        run: |
          set -euo pipefail
          kubectl create namespace rte
          helm install rte . \
            --namespace rte \
            --values ci/no-ingress-values.yaml \
            --wait --timeout 12m
          pod="$(kubectl -n rte get pod -l app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n rte cp ../../test/e2e/rte-playbook.mjs "$pod:/tmp/rte-playbook.mjs" -c server
          kubectl -n rte exec "$pod" -c server -- node /tmp/rte-playbook.mjs || {
            kubectl -n rte logs "$pod" -c rte --tail=60
            exit 1
          }
          # The sessions are signed with the chart's ACCESS_TOKEN_SECRET, not a key the app
          # made up at start, so a restart signs nobody out.
          if kubectl -n rte logs "$pod" -c server | grep -q "ACCESS_TOKEN_SECRET is not set"; then
            echo "::error::The app runs without ACCESS_TOKEN_SECRET: every restart signs everybody out."
            exit 1
          fi
          helm uninstall rte --namespace rte

      # Generation only works where the chart can read the cluster, so it cannot
      # be covered by rendering. What matters is that the value it invents is
      # the right length and, above all, that it never changes afterwards:
      # ENCRYPTION_SECRET is the key stored credentials are encrypted with, and
      # a new one turns them into rubbish without raising anything.
      - name: Generated credentials are the right size and never move
        run: |
          set -euo pipefail
          kubectl create namespace generated
          helm install generated . --namespace generated \
            --values ci/no-ingress-values.yaml \
            --set applications.mysql.password=null \
            --set applications.server.env.ADMIN_PASSWORD=null \
            --set applications.server.env.ENCRYPTION_SECRET=null \
            --set applications.mysql.user=null \
            --set applications.server.env.ACCESS_TOKEN_SECRET=null \
            --set applications.rte.token=null \
            --set secrets.generate=true --wait --timeout 12m

          read_key() {
            kubectl -n generated get secret generated-secrets \
              -o jsonpath="{.data.$1}" | base64 -d
          }
          enc="$(read_key ENCRYPTION_SECRET)"
          echo "ENCRYPTION_SECRET is ${#enc} characters"
          # The application uses it as an aes-256 key directly, padding anything
          # shorter with a constant from its own source and cutting anything
          # longer. 32 is the only length that is entirely secret.
          [ "${#enc}" = "32" ] || {
            echo "::error::Generated ENCRYPTION_SECRET is ${#enc} characters, not 32."; exit 1; }
          [ -n "$(read_key DB_PASSWORD)" ] && [ -n "$(read_key ADMIN_PASSWORD)" ] || {
            echo "::error::A generated credential came out empty."; exit 1; }
          # No user given and a cluster to read: a new install connects as "ansibleforms"
          [ "$(read_key DB_USER)" = "ansibleforms" ] || {
            echo "::error::An empty applications.mysql.user gave $(read_key DB_USER), not ansibleforms."; exit 1; }

          # The keys the chart generates on its own, into <release>-keys, likewise
          read_keys() {
            kubectl -n generated get secret generated-keys -o jsonpath="{.data.$1}" | base64 -d
          }
          session="$(read_keys ACCESS_TOKEN_SECRET)"
          token="$(read_keys RTE_TOKEN)"
          [ "${#session}" = "64" ] && [ "${#token}" = "32" ] || {
            echo "::error::Generated ACCESS_TOKEN_SECRET is ${#session} and RTE_TOKEN ${#token} characters, not 64 and 32."; exit 1; }

          before="$enc"
          pod_before="$(kubectl -n generated get pods -o name | sort | tr '\n' ' ')"
          for i in 1 2; do
            helm upgrade generated . --namespace generated \
              --values ci/no-ingress-values.yaml \
              --set applications.mysql.password=null \
              --set applications.server.env.ADMIN_PASSWORD=null \
              --set applications.server.env.ENCRYPTION_SECRET=null \
              --set applications.mysql.user=null \
              --set applications.server.env.ACCESS_TOKEN_SECRET=null \
              --set applications.rte.token=null \
              --set secrets.generate=true --wait --timeout 12m >/dev/null
          done
          [ "$(read_key ENCRYPTION_SECRET)" = "$before" ] || {
            echo "::error::ENCRYPTION_SECRET changed across an upgrade. Everything it encrypted is now unreadable."
            exit 1; }
          [ "$(read_key DB_USER)" = "ansibleforms" ] || {
            echo "::error::The upgrades did not keep the database user the Secret held."; exit 1; }
          [ "$(read_keys ACCESS_TOKEN_SECRET)" = "$session" ] && [ "$(read_keys RTE_TOKEN)" = "$token" ] || {
            echo "::error::A generated key moved across an upgrade: the app and the RTE would drift apart."; exit 1; }
          [ "$(kubectl -n generated get pods -o name | sort | tr '\n' ' ')" = "$pod_before" ] || {
            echo "::error::Generation recycled the pods on an upgrade that changed nothing."; exit 1; }
          echo "Stable across two upgrades, and nothing was recycled."

          # helm.sh/resource-policy: keep means uninstall leaves it, so a
          # reinstall finds the same key and whatever it encrypted still opens.
          helm uninstall generated --namespace generated
          kubectl -n generated get secret generated-secrets >/dev/null || {
            echo "::error::uninstall removed the generated Secret. A reinstall would lose the data."
            exit 1; }
          kubectl -n generated delete pvc --all --wait=true
          helm install generated . --namespace generated \
            --values ci/no-ingress-values.yaml \
            --set applications.mysql.password=null \
            --set applications.server.env.ADMIN_PASSWORD=null \
            --set applications.server.env.ENCRYPTION_SECRET=null \
            --set applications.mysql.user=null \
            --set applications.server.env.ACCESS_TOKEN_SECRET=null \
            --set applications.rte.token=null \
            --set secrets.generate=true --wait --timeout 12m
          [ "$(read_key ENCRYPTION_SECRET)" = "$before" ] || {
            echo "::error::A reinstall generated a different key."; exit 1; }
          echo "A reinstall picked the same key back up."

          helm test generated --namespace generated --logs
          helm uninstall generated --namespace generated

      # The restricted Pod Security Standard is enforced by default on several
      # managed distributions. The chart once could not be installed under it at
      # all: the MySQL container had no security context and the server had an
      # init container running as root to chown its volume.
      # Labelling the namespace makes the API server the judge, so this passes
      # only if every pod the chart creates is genuinely acceptable.
      - name: Install where the restricted Pod Security Standard is enforced
        run: |
          set -euo pipefail
          kubectl create namespace restricted
          kubectl label namespace restricted \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=latest
          # A plain pod is refused here, which is the point of the label
          if kubectl -n restricted run canary --image=busybox --restart=Never \
               --command -- true 2>/dev/null; then
            echo "::error::The namespace is not actually enforcing restricted."
            exit 1
          fi
          echo "A pod with no security context is refused here, as expected."

          helm install restricted . \
            --namespace restricted \
            --values ci/no-ingress-values.yaml \
            --wait --timeout 12m
          kubectl -n restricted get pods

          # Non-root, both of them, and no init container left behind
          for c in server database; do
            pod="$(kubectl -n restricted get pod -l "app.kubernetes.io/component=$c" \
                     -o jsonpath='{.items[0].metadata.name}')"
            uid="$(kubectl -n restricted get pod "$pod" \
                     -o jsonpath='{.spec.securityContext.runAsUser}')"
            echo "$c runs as uid $uid"
            [ -n "$uid" ] && [ "$uid" != "0" ] || {
              echo "::error::$c is not pinned to a non-root uid."; exit 1; }
          done
          if kubectl -n restricted get deploy -l app.kubernetes.io/component=server \
               -o jsonpath='{.items[0].spec.template.spec.initContainers}' | grep -q .; then
            echo "::error::The server still has an init container. The root chown was supposed to go."
            exit 1
          fi

          # The chart's own test pod has to be acceptable here too. ct already
          # runs helm test after its installs, but not in a namespace that
          # enforces anything, so a test pod the API server refuses would only
          # show up in front of a user.
          helm test restricted --namespace restricted --logs

          helm uninstall restricted --namespace restricted

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods --all-namespaces
          kubectl describe pods --all-namespaces
          kubectl logs --all-containers --tail=200 --selector app.kubernetes.io/component=server --all-namespaces || true
          kubectl logs --all-containers --tail=200 --selector app.kubernetes.io/component=database --all-namespaces || true

  # Every release so far has been an upgrade risk, and nothing here ever ran
  # helm upgrade: the whole suite installs from scratch. A chart that renames a
  # PersistentVolumeClaim passes every other check in this file while quietly
  # provisioning an empty volume and deleting the one holding the data.
  upgrade:
    name: Upgrade a live release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      # The Kubernetes, kubeconform and Calico versions live in test/versions/Dockerfile,
      # where Dependabot can bump them. kind and kubectl come with helm/kind-action, pinned
      # to an exact release (the floating v1 tag lagged a kind release behind) so that
      # Dependabot moves it.
      - name: Read the pinned versions
        id: versions
        working-directory: .
        run: |
          set -euo pipefail
          from() { awk -v stage="$1" '$1 == "FROM" && $NF == stage {print $2}' test/versions/Dockerfile; }
          node="$(from kind-node)"
          kube="${node#*:v}"
          calico="$(from calico)"
          {
            echo "kind_node=$node"
            echo "kubernetes=${kube%@*}"
            echo "kubeconform=$(from kubeconform)"
            echo "calico=${calico##*:}"
            echo "chart_testing=$(from chart-testing)"
          } >> "$GITHUB_OUTPUT"
          echo "kind node $node, kubeconform $(from kubeconform), calico ${calico##*:}"

      - uses: helm/kind-action@v1.15.0
        with:
          node_image: ${{ steps.versions.outputs.kind_node }}

      - name: Install the published chart, put data in it, then upgrade to this one
        run: |
          set -euo pipefail

          NS=upgrade
          helm repo add ansibleforms https://ansibleforms.com/helm-charts/ >/dev/null
          helm repo update >/dev/null

          # The newest published version of the same major as this branch, no newer than
          # it: on main that is the last 7.x, on release/6.x the last 6.x. Taking the
          # newest version overall would have a 6.x pull request "upgrade" a 7 release
          # down to 6. The first chart of a new major has no predecessor of its own, so
          # it falls back to the newest one below it, which tests the major upgrade.
          HERE="$(helm show chart . | awk '/^version:/ {print $2}')"
          PREV="$(helm search repo ansibleforms/ansibleforms --versions -o json | HERE="$HERE" python3 -c '
          import json, os, sys
          key = lambda s: tuple(int(x) for x in s.split("-")[0].split("."))
          here = key(os.environ["HERE"])
          versions = [e["version"] for e in json.load(sys.stdin)]
          same = [v for v in versions if key(v)[0] == here[0] and key(v) <= here]
          lower = [v for v in versions if key(v) < here]
          pool = same or lower
          print(max(pool, key=key) if pool else "")')"
          if [ -z "$PREV" ]; then
            echo "::notice::No chart up to $HERE was ever published: the first chart has nothing to upgrade from."
            exit 0
          fi
          echo "Upgrading a live $PREV release to $HERE"

          kubectl create namespace "$NS"
          helm install upg ansibleforms/ansibleforms --version "$PREV" \
            --namespace "$NS" --values ci/no-ingress-values.yaml --wait --timeout 12m

          MYSQL="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=database -o name | head -1)"
          SERVER="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=server -o name | head -1)"
          echo "Found $MYSQL and $SERVER"

          # Something in the database and something on the server's volume, so the check
          # afterwards is about data rather than about objects existing.
          #
          # Over TCP, not the unix socket. The chart mounts its own /etc/mysql/my.cnf over
          # the one the image ships, so the socket path the client looks for and the one
          # the server opens do not necessarily agree, and which way it falls depends on
          # the image layer underneath. TCP is how AnsibleForms connects and how the probe
          # checks, so it is the only path worth relying on here.
          kubectl -n "$NS" exec "$MYSQL" -- sh -c 'mysql -h 127.0.0.1 --protocol=TCP -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
            USE AnsibleForms;
            CREATE TABLE IF NOT EXISTS upgrade_marker (note varchar(64));
            DELETE FROM upgrade_marker;
            INSERT INTO upgrade_marker VALUES (\"written-before-the-upgrade\");"'
          kubectl -n "$NS" exec "$SERVER" -c server -- \
            sh -c 'echo written-before-the-upgrade > /app/dist/persistent/upgrade-marker.txt'

          kubectl -n "$NS" get pvc -o json > /tmp/pvc-before.json

          helm upgrade upg . --namespace "$NS" --values ci/no-ingress-values.yaml --wait --timeout 12m

          kubectl -n "$NS" get pvc -o json > /tmp/pvc-after.json

          # The claims have to be the same claims bound to the same volumes. A renamed PVC
          # does not move a volume, it provisions an empty one and deletes the old, and
          # every check below this line would still pass while the data was gone.
          python3 - <<'PY'
          import json, sys

          def claims(path):
              return {i["metadata"]["name"]: i["spec"]["volumeName"]
                      for i in json.load(open(path))["items"]}

          before, after = claims("/tmp/pvc-before.json"), claims("/tmp/pvc-after.json")
          print("before:", before)
          print("after :", after)
          if before != after:
              lost = {k: v for k, v in before.items() if after.get(k) != v}
              sys.exit(f"::error::The upgrade moved storage. These claims changed or "
                       f"disappeared: {lost}. A renamed or reprovisioned claim is an empty "
                       f"volume with the old one deleted underneath it.")
          print("Every claim still points at the volume it pointed at before.")
          PY

          MYSQL="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=database -o name | head -1)"
          SERVER="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=server -o name | head -1)"

          row="$(kubectl -n "$NS" exec "$MYSQL" -- sh -c \
            'mysql -h 127.0.0.1 --protocol=TCP -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "USE AnsibleForms; SELECT note FROM upgrade_marker;"' \
            2>/dev/null | tr -d '\r')"
          [ "$row" = "written-before-the-upgrade" ] || {
            echo "::error::The row written before the upgrade is gone. Got: '$row'"; exit 1; }

          file="$(kubectl -n "$NS" exec "$SERVER" -c server -- \
            cat /app/dist/persistent/upgrade-marker.txt 2>/dev/null | tr -d '\r')"
          [ "$file" = "written-before-the-upgrade" ] || {
            echo "::error::The file written before the upgrade is gone. Got: '$file'"; exit 1; }

          # And it still works afterwards, not merely survives
          svc="$(kubectl -n "$NS" get svc -l app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "$NS" run curl-upgrade --rm -i --restart=Never --image=curlimages/curl:8.10.1 --quiet -- \
            curl -sf -o /dev/null "http://${svc}.${NS}.svc.cluster.local/" || {
            echo "::error::The application does not answer after the upgrade."; exit 1; }

          echo "Data and storage survived the upgrade from $PREV to $HERE, and the app answers."

          # The rollout checksums are computed from what the chart renders, so an
          # upgrade that changes nothing must not move them. If it does, every
          # release churns both pods for no reason.
          before="$(kubectl -n "$NS" get pods -o name | sort | tr '\n' ' ')"
          helm upgrade upg . --namespace "$NS" --values ci/no-ingress-values.yaml --wait --timeout 12m >/dev/null
          after="$(kubectl -n "$NS" get pods -o name | sort | tr '\n' ' ')"
          if [ "$before" != "$after" ]; then
            echo "::error::An upgrade with no changes recycled the pods."
            echo "  before: $before"
            echo "  after:  $after"
            exit 1
          fi
          echo "An upgrade with nothing changed leaves both pods alone."

          # Rolling back is the other half of upgrading, and nothing here ever
          # tried it. Revision 1 is the published chart this started from, so
          # this walks the whole change backwards, security contexts, volume
          # ownership and all.
          echo "Rolling back to revision 1, which is $PREV"
          helm rollback upg 1 --namespace "$NS" --wait --timeout 12m

          kubectl -n "$NS" get pvc -o json > /tmp/pvc-rollback.json
          python3 - <<'PY'
          import json, sys

          def claims(path):
              return {i["metadata"]["name"]: i["spec"]["volumeName"]
                      for i in json.load(open(path))["items"]}

          before, after = claims("/tmp/pvc-before.json"), claims("/tmp/pvc-rollback.json")
          if before != after:
              sys.exit(f"::error::The rollback moved storage. Was {before}, now {after}.")
          print("The rollback left every claim on the volume it started on.")
          PY

          MYSQL="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=database -o name | head -1)"
          row="$(kubectl -n "$NS" exec "$MYSQL" -- sh -c \
            'mysql -h 127.0.0.1 --protocol=TCP -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "USE AnsibleForms; SELECT note FROM upgrade_marker;"' \
            2>/dev/null | tr -d '\r')"
          [ "$row" = "written-before-the-upgrade" ] || {
            echo "::error::The row is gone after the rollback. Got: '$row'"; exit 1; }

          kubectl -n "$NS" run curl-rollback --rm -i --restart=Never --image=curlimages/curl:8.10.1 --quiet -- \
            curl -sf -o /dev/null "http://${svc}.${NS}.svc.cluster.local/" || {
            echo "::error::The application does not answer after the rollback."; exit 1; }

          echo "Rolled back to $PREV with the data intact and the app answering."
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n upgrade get all,pvc || true
          kubectl -n upgrade describe pods || true
          kubectl -n upgrade logs --all-containers --tail=200 \
            --selector app.kubernetes.io/component=server || true

  # kind has no ingress controller, so until now the Ingress was rendered,
  # validated against the schema and never asked for a single page. A port bug
  # once lived exactly there: a manifest that validates perfectly and that no
  # controller can route.
  ingress:
    name: Route through a real ingress controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      # The Kubernetes, kubeconform and Calico versions live in test/versions/Dockerfile,
      # where Dependabot can bump them. kind and kubectl come with helm/kind-action, pinned
      # to an exact release (the floating v1 tag lagged a kind release behind) so that
      # Dependabot moves it.
      - name: Read the pinned versions
        id: versions
        working-directory: .
        run: |
          set -euo pipefail
          from() { awk -v stage="$1" '$1 == "FROM" && $NF == stage {print $2}' test/versions/Dockerfile; }
          node="$(from kind-node)"
          kube="${node#*:v}"
          calico="$(from calico)"
          {
            echo "kind_node=$node"
            echo "kubernetes=${kube%@*}"
            echo "kubeconform=$(from kubeconform)"
            echo "calico=${calico##*:}"
            echo "chart_testing=$(from chart-testing)"
          } >> "$GITHUB_OUTPUT"
          echo "kind node $node, kubeconform $(from kubeconform), calico ${calico##*:}"

      - uses: helm/kind-action@v1.15.0
        with:
          node_image: ${{ steps.versions.outputs.kind_node }}

      # Traefik, from its official chart pinned to an exact release. ingress-nginx
      # is retired upstream, and Traefik is what the chart is run behind in
      # practice. ClusterIP and a port-forward rather than the kind specific
      # hostPort deployment, so this needs nothing special from the cluster; a
      # LoadBalancer Service would also keep --wait waiting for an address kind
      # never hands out. The chart installs the CRDs, ServersTransport among
      # them, and a default IngressClass named traefik.
      - name: Install Traefik
        env:
          TRAEFIK_CHART_VERSION: 41.7.1
        run: |
          set -euo pipefail
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm install traefik traefik/traefik --version "$TRAEFIK_CHART_VERSION" \
            --namespace traefik --create-namespace \
            --set service.spec.type=ClusterIP \
            --wait --timeout 8m

      - name: Ask for the page, plain and with the application terminating TLS
        run: |
          set -euo pipefail

          check() {
            ns="$1"; values="$2"; host="$3"
            echo "::group::$values through a real Traefik"
            kubectl create namespace "$ns"
            # The application's certificate is self-signed, so Traefik needs a
            # ServersTransport that skips verification before it will speak TLS to
            # it. The HTTPS values point the Service at this one by name; the
            # plain one gets it too and never uses it.
            kubectl -n "$ns" apply -f - <<EOF
          apiVersion: traefik.io/v1alpha1
          kind: ServersTransport
          metadata:
            name: insecure
          spec:
            insecureSkipVerify: true
          EOF
            helm install ing . --namespace "$ns" --values "$values" --wait --timeout 12m >/dev/null

            kubectl -n "$ns" get ingress -o jsonpath='{range .items[*]}  backend: {.spec.rules[0].http.paths[0].backend.service}{"\n"}{end}'
            kubectl -n "$ns" get svc -l app.kubernetes.io/component=server -o jsonpath='{range .items[*]}  service: {.spec.ports}{"\n"}{end}'

            # The controller needs a moment to pick the Ingress up and reload
            for i in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" \
                        --max-time 10 http://127.0.0.1:8080/ || echo 000)"
              [ "$code" = "200" ] && break
              sleep 4
            done

            body="$(curl -s -H "Host: $host" --max-time 10 http://127.0.0.1:8080/ || true)"
            echo "  HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::$values is not reachable through the ingress, got $code."
              kubectl -n "$ns" get ingress,svc,endpointslices
              kubectl -n traefik logs deployment/traefik --tail=40
              exit 1
            fi
            case "$body" in
              *"Ansible Forms"*) echo "  the page served is AnsibleForms" ;;
              *) echo "::error::Something answered 200 but it was not the application."; exit 1 ;;
            esac
            helm uninstall ing --namespace "$ns" >/dev/null
            kubectl delete namespace "$ns" --wait=false >/dev/null
            echo "::endgroup::"
          }

          kubectl -n traefik port-forward svc/traefik 8080:80 >/dev/null 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          sleep 3

          check ing-http  ../../test/values/ingress-http-values.yaml  ansibleforms.ci.example.com
          check ing-https ../../test/values/ingress-https-values.yaml ansibleforms.ci.example.com
          echo "Both the plain and the TLS backend answer through a real ingress controller."


      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get ingress -A || true
          kubectl -n traefik logs deployment/traefik --tail=100 || true

  # NetworkPolicy is enforced by the CNI, and kind ships kindnet, which does not
  # enforce it. A policy test on a default cluster would pass while proving
  # nothing at all, so this one brings its own Calico.
  #
  # It earned its place immediately: writing it turned up a false pass in the
  # chart's own helm test, which reported a healthy database while the policy
  # was dropping the traffic.
  networkpolicy:
    name: Enforce the NetworkPolicy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      # The Kubernetes, kubeconform and Calico versions live in test/versions/Dockerfile,
      # where Dependabot can bump them. kind and kubectl come with helm/kind-action, pinned
      # to an exact release (the floating v1 tag lagged a kind release behind) so that
      # Dependabot moves it.
      - name: Read the pinned versions
        id: versions
        working-directory: .
        run: |
          set -euo pipefail
          from() { awk -v stage="$1" '$1 == "FROM" && $NF == stage {print $2}' test/versions/Dockerfile; }
          node="$(from kind-node)"
          kube="${node#*:v}"
          calico="$(from calico)"
          {
            echo "kind_node=$node"
            echo "kubernetes=${kube%@*}"
            echo "kubeconform=$(from kubeconform)"
            echo "calico=${calico##*:}"
            echo "chart_testing=$(from chart-testing)"
          } >> "$GITHUB_OUTPUT"
          echo "kind node $node, kubeconform $(from kubeconform), calico ${calico##*:}"

      - uses: helm/kind-action@v1.15.0
        with:
          node_image: ${{ steps.versions.outputs.kind_node }}
          config: test/kind/calico.yaml

      - name: Install Calico
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/projectcalico/calico/${{ steps.versions.outputs.calico }}/manifests/calico.yaml"
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=8m
          kubectl wait --for=condition=Ready node --all --timeout=5m

      - name: A pod with no business reaching MySQL must not reach it
        run: |
          set -euo pipefail
          kubectl create namespace np
          helm install np . --namespace np --values ci/no-ingress-values.yaml \
            --wait --timeout 12m

          # MySQL sends a handshake as soon as a connection is accepted, so
          # bytes on the wire are proof and silence is proof of the opposite.
          # An exit code is not: a dropped connection times out exactly like a
          # closed port, which is how the false pass got in.
          probe() {
            kubectl -n np run "$1" --rm -i --restart=Never --quiet \
              --image=curlimages/curl:8.10.1 --overrides="$2" 2>/dev/null | grep RESULT
          }
          plain='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":100,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"probe","image":"curlimages/curl:8.10.1","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}},"command":["sh","-c","out=$(curl -s --max-time 8 --connect-timeout 8 telnet://np-mysql:3306 </dev/null 2>/dev/null || true); [ -n \"$out\" ] && echo \"RESULT reached ${#out}\" || echo RESULT blocked"]}]}}'

          echo "::group::without a policy, anything in the namespace can reach the database"
          before="$(probe baseline "$plain")"
          echo "  $before"
          case "$before" in
            *reached*) ;;
            *) echo "::error::The baseline could not reach MySQL, so this proves nothing."; exit 1 ;;
          esac
          echo "::endgroup::"

          echo "::group::with the policy on"
          helm upgrade np . --namespace np --values ci/no-ingress-values.yaml \
            --set networkPolicy.enabled=true --wait --timeout 12m
          kubectl -n np get networkpolicy
          after="$(probe blocked "$plain")"
          echo "  $after"
          case "$after" in
            *blocked*) echo "  the same pod can no longer reach the database" ;;
            *) echo "::error::The policy is on and an unrelated pod still reached MySQL."; exit 1 ;;
          esac
          echo "::endgroup::"

          # And the release still works, which is the half a policy usually breaks
          helm test np --namespace np --logs

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n np get all,networkpolicy || true
          kubectl -n np describe pods || true

  # The one check the branch rules require. Requiring the jobs one by one would tie the
  # rules to the matrix job names, which change whenever the Kubernetes versions move,
  # and requiring only Lint and render let a pull request merge (auto-merge included)
  # before the clusters had finished with it. This passes only when every job did.
  passed:
    name: CI passed
    if: always()
    needs: [lint, install, upgrade, ingress, networkpolicy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A CI job ended with '$result'."; exit 1; }
          done
